<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --willy-navy:#141B3C; --willy-sub:#8A8CA0; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(160deg, var(--willy-navy), #1E2650);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:360px; background:#fff; border-radius:18px;
    padding:36px 30px 30px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .logo-row{display:flex; justify-content:center; margin-bottom:28px;}
  .logo-row svg{width:110px; height:auto;}
  h1{font-size:16px; font-weight:800; text-align:center; margin:0 0 22px; color:#1A1A22;}
  label{display:block; font-size:12.5px; font-weight:600; color:#1A1A22; margin:0 0 6px;}
  input{
    width:100%; padding:11px 13px; border:1px solid #E4E4E7; border-radius:10px;
    font-family:inherit; font-size:14px; margin-bottom:16px; outline:none;
  }
  input:focus{border-color:var(--willy-navy);}
  button.submit{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--willy-navy);
    color:#fff; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  button.submit:disabled{opacity:.6; cursor:default;}
  button.submit:hover:not(:disabled){background:#1E2650;}
  .forgot{display:block; text-align:center; margin-top:16px; font-size:12.5px; color:var(--willy-sub); text-decoration:none; cursor:pointer; background:none; border:none; font-family:inherit;}
  .forgot:hover{color:var(--willy-navy);}
  .msg{font-size:12.5px; text-align:center; margin:0 0 14px; padding:9px 10px; border-radius:8px;}
  .msg.err{background:#FFE1E8; color:#D81A3C;}
  .msg.ok{background:#DFEAFF; color:#1338BE;}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <svg viewBox="0 0 656 132" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M501.642 0H537.276L578.942 58.0691L620.42 0H655.111L593.648 80.1278V131.975H563.105V80.1278L501.642 0Z" fill="#141B3C"/>
      <path d="M420.872 0H449.718V109.916H535.124V131.975H420.872V0Z" fill="#141B3C"/>
      <path d="M289.73 0H318.576V109.916H403.983V131.975H289.73V0Z" fill="#141B3C"/>
      <path d="M229.934 0H260.289V131.975H229.934V0Z" fill="#141B3C"/>
      <path d="M171.379 131.975H140.082L106.9 36.0104L73.5291 131.975H41.8551L9.15527e-05 0H31.6741L59.0118 101.809L92.5712 3.77072H121.606L155.165 101.432L182.314 0H213.046L171.379 131.975Z" fill="#141B3C"/>
    </svg>
  </div>
  <h1>대시보드 로그인</h1>
  <div id="msg-slot"></div>
  <form id="login-form">
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" class="submit" id="submit-btn">로그인</button>
  </form>
  <button type="button" class="forgot" id="forgot-btn">비밀번호를 잊으셨나요?</button>
</div>

<script>
  const SUPABASE_URL = 'https://gsqurjwbdkenmjwspucq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcXVyandiZGtlbm1qd3NwdWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTY3MjIsImV4cCI6MjEwMjEzMjcyMn0.VWwpg2uLfFWquknfnKjsj6a_-AfTdQJS8LVw9dSQ0xo';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function qs(name){
    return new URLSearchParams(location.search).get(name);
  }
  function redirectTarget(){
    const r = qs('redirect');
    return '../' + (r || 'index.html');
  }
  function showMsg(text, kind){
    document.getElementById('msg-slot').innerHTML = `<div class="msg ${kind}">${text}</div>`;
  }

  // 이미 로그인되어 있으면 바로 이동
  db.auth.getSession().then(({data})=>{
    if(data && data.session) location.href = redirectTarget();
  });

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '로그인 중...';
    document.getElementById('msg-slot').innerHTML = '';
    const { error } = await db.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = '로그인';
    if(error){
      showMsg('이메일 또는 비밀번호가 올바르지 않습니다.', 'err');
      return;
    }
    location.href = redirectTarget();
  });

  document.getElementById('forgot-btn').addEventListener('click', async ()=>{
    const email = document.getElementById('email').value.trim();
    if(!email){
      showMsg('먼저 이메일을 입력해주세요.', 'err');
      return;
    }
    const resetUrl = location.origin + location.pathname.replace(/login\/index\.html$/, 'login/update-password.html');
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: resetUrl });
    if(error){
      showMsg('재설정 메일 발송에 실패했습니다: ' + error.message, 'err');
      return;
    }
    showMsg('입력하신 이메일로 비밀번호 재설정 링크를 보냈습니다.', 'ok');
  });
</script>
</body>
</html>

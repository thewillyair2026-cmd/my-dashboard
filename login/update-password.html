<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --willy-navy:#141B3C; --willy-sub:#8A8CA0; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(160deg, var(--willy-navy), #1E2650);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:360px; background:#fff; border-radius:18px;
    padding:36px 30px 30px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .logo-row{display:flex; justify-content:center; margin-bottom:28px;}
  .logo-row svg{width:110px; height:auto;}
  h1{font-size:16px; font-weight:800; text-align:center; margin:0 0 8px; color:#1A1A22;}
  p.sub{font-size:12.5px; text-align:center; color:var(--willy-sub); margin:0 0 22px;}
  label{display:block; font-size:12.5px; font-weight:600; color:#1A1A22; margin:0 0 6px;}
  input{
    width:100%; padding:11px 13px; border:1px solid #E4E4E7; border-radius:10px;
    font-family:inherit; font-size:14px; margin-bottom:16px; outline:none;
  }
  input:focus{border-color:var(--willy-navy);}
  button.submit{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--willy-navy);
    color:#fff; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  button.submit:disabled{opacity:.6; cursor:default;}
  button.submit:hover:not(:disabled){background:#1E2650;}
  .msg{font-size:12.5px; text-align:center; margin:0 0 14px; padding:9px 10px; border-radius:8px;}
  .msg.err{background:#FFE1E8; color:#D81A3C;}
  .msg.ok{background:#DFEAFF; color:#1338BE;}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <svg viewBox="0 0 656 132" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M501.642 0H537.276L578.942 58.0691L620.42 0H655.111L593.648 80.1278V131.975H563.105V80.1278L501.642 0Z" fill="#141B3C"/>
      <path d="M420.872 0H449.718V109.916H535.124V131.975H420.872V0Z" fill="#141B3C"/>
      <path d="M289.73 0H318.576V109.916H403.983V131.975H289.73V0Z" fill="#141B3C"/>
      <path d="M229.934 0H260.289V131.975H229.934V0Z" fill="#141B3C"/>
      <path d="M171.379 131.975H140.082L106.9 36.0104L73.5291 131.975H41.8551L9.15527e-05 0H31.6741L59.0118 101.809L92.5712 3.77072H121.606L155.165 101.432L182.314 0H213.046L171.379 131.975Z" fill="#141B3C"/>
    </svg>
  </div>
  <h1>새 비밀번호 설정</h1>
  <p class="sub">이메일로 받으신 링크를 통해 접속하셨습니다</p>
  <div id="msg-slot"></div>
  <form id="update-form">
    <label for="password">새 비밀번호</label>
    <input id="password" type="password" autocomplete="new-password" minlength="6" required />
    <label for="password2">새 비밀번호 확인</label>
    <input id="password2" type="password" autocomplete="new-password" minlength="6" required />
    <button type="submit" class="submit" id="submit-btn">비밀번호 변경</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://gsqurjwbdkenmjwspucq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcXVyandiZGtlbm1qd3NwdWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTY3MjIsImV4cCI6MjEwMjEzMjcyMn0.VWwpg2uLfFWquknfnKjsj6a_-AfTdQJS8LVw9dSQ0xo';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, kind){
    document.getElementById('msg-slot').innerHTML = `<div class="msg ${kind}">${text}</div>`;
  }

  let recoveryReady = false;
  db.auth.onAuthStateChange((event)=>{
    if(event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });
  db.auth.getSession().then(({data})=>{
    if(data && data.session) recoveryReady = true;
  });

  document.getElementById('update-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if(p1 !== p2){
      showMsg('비밀번호가 일치하지 않습니다.', 'err');
      return;
    }
    if(!recoveryReady){
      showMsg('유효하지 않거나 만료된 링크입니다. 로그인 화면에서 다시 요청해주세요.', 'err');
      return;
    }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '변경 중...';
    const { error } = await db.auth.updateUser({ password: p1 });
    btn.disabled = false; btn.textContent = '비밀번호 변경';
    if(error){
      showMsg('변경에 실패했습니다: ' + error.message, 'err');
      return;
    }
    showMsg('비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.', 'ok');
    setTimeout(()=>{ location.href = 'index.html'; }, 2000);
  });
</script>
</body>
</html>

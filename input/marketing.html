<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#141B3C">
<meta name="apple-mobile-web-app-title" content="WILLY">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마케팅 비용 입력 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#ea580c; --accent-light:#fed7aa; }
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;margin-bottom:14px;}
  .form-grid label{font-size:11.5px;font-weight:600;color:var(--willy-sub);display:block;margin-bottom:4px;}
  .form-grid input{width:100%;padding:8px 10px;border:1px solid #E4E4E7;border-radius:8px;font-family:inherit;font-size:13px;}
  .btn{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#c2410c;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;white-space:nowrap;}
  th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  td{border-bottom:1px solid #f4f4f5;}
  td.num{text-align:right;}
  th.num{text-align:right;}
  .table-scroll{overflow-x:auto;}
  .msg{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .msg.ok{background:#DFEAFF;color:#1338BE;}
  .msg.err{background:#FFE1E8;color:#D81A3C;}
  .loading,.err-box{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'marketing', title:'마케팅 비용 입력', subtitle:'네이버 광고 외 채널(전단지·쿠팡 등)의 월별 비용을 기록합니다'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const db = () => WillyShell.getAuthClient();
  const thisYm = () => { const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0'); };

  let naverRows = [];

  async function main(){
    const content = document.getElementById('content');
    try{
      const { data, error } = await db().from('marketing_cost_monthly').select('*').order('ym',{ascending:false});
      if(error) throw error;
      // 네이버 광고 표는 쓰기 정책(sql/14) 적용 전이어도 조회는 되므로 오류는 무시
      const { data:nv } = await db().from('marketing_naver_ads').select('*').order('month',{ascending:false});
      naverRows = nv || [];
      render(data || []);
    }catch(err){
      content.innerHTML = `<div class="err-box">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function render(rows){
    const thisMonthTotal = rows.filter(r=>r.ym===thisYm()).reduce((s,r)=>s+r.amount,0);
    const allTotal = rows.reduce((s,r)=>s+r.amount,0);

    const content = document.getElementById('content');
    content.innerHTML = `
      <a href="marketing-daily.html" style="display:inline-block;font-size:13px;font-weight:700;margin-bottom:14px;">→ 일별 성과(모닝브리핑) 입력하기</a>
      <div class="cards">
        <div class="card"><div class="label">이번 달(${thisYm()}) 합계</div><div class="value">${won(thisMonthTotal)}원</div></div>
        <div class="card"><div class="label">누적 합계</div><div class="value">${won(allTotal)}원</div></div>
      </div>

      <div class="panel">
        <h2>비용 입력</h2>
        <p class="panel-note">같은 연월·채널로 다시 입력하면 기존 값을 덮어씁니다</p>
        <div id="msg-slot"></div>
        <div class="form-grid">
          <div><label>연월 (YYYY.MM)</label><input id="f-ym" type="text" value="${thisYm()}" /></div>
          <div><label>채널명</label><input id="f-channel" type="text" placeholder="전단지광고, 쿠팡 등" /></div>
          <div><label>금액(원)</label><input id="f-amount" type="number" step="1" /></div>
          <div><button class="btn" id="save-btn">저장</button></div>
        </div>
      </div>


      <div class="panel">
        <h2>네이버 유료광고 월별 입력</h2>
        <p class="panel-note">대행사 월 리포트 기준 · 같은 연월·상품으로 다시 입력하면 덮어씁니다 · 광고비는 VAT 포함, 대행사 수수료 포함 총액 · 마케팅 대시보드의 네이버 유료광고 패널에 반영됩니다</p>
        <div id="nv-msg"></div>
        <div class="form-grid">
          <div><label>연월 (YYYY.MM)</label><input id="nv-month" type="text" value="${thisYm()}" /></div>
          <div><label>상품</label><select id="nv-product" style="width:100%;padding:8px 10px;border:1px solid #E4E4E7;border-radius:8px;font-family:inherit;font-size:13px;"><option>파워링크</option><option>쇼핑검색</option></select></div>
          <div><label>노출수</label><input id="nv-impr" type="number" step="1" /></div>
          <div><label>클릭수</label><input id="nv-clicks" type="number" step="1" /></div>
          <div><label>광고비(원)</label><input id="nv-spend" type="number" step="1" /></div>
          <div><label>전환수</label><input id="nv-conv" type="number" step="1" /></div>
          <div><label>전환매출(원)</label><input id="nv-convrev" type="number" step="1" /></div>
          <div><label>대행사 수수료율(%)</label><input id="nv-fee" type="number" step="0.1" value="10" /></div>
        </div>
        <button class="btn" id="nv-save">네이버 광고 저장</button>
        <div class="table-scroll" style="margin-top:14px;">
        <table>
          <thead><tr><th>연월</th><th>상품</th><th class="num">노출</th><th class="num">클릭</th><th class="num">광고비</th><th class="num">전환</th><th class="num">전환매출</th></tr></thead>
          <tbody>${naverRows.map(r=>`<tr><td>${r.month}</td><td>${r.product}</td><td class="num">${won(r.impressions)}</td><td class="num">${won(r.clicks)}</td><td class="num">${won(r.spend)}원</td><td class="num">${won(r.conversions)}</td><td class="num">${won(r.conversion_revenue)}원</td></tr>`).join('') || '<tr><td colspan="7" style="color:var(--willy-sub);">입력된 내역이 없습니다.</td></tr>'}</tbody>
        </table>
        </div>
      </div>

      <div class="panel">
        <h2>입력 내역</h2>
        <div class="table-scroll">
        <table>
          <thead><tr><th>연월</th><th>채널</th><th class="num">금액</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${r.ym}</td><td>${r.channel}</td><td class="num">${won(r.amount)}원</td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--willy-sub);">입력된 내역이 없습니다.</td></tr>'}
          </tbody>
        </table>
        </div>
      </div>
    `;

    document.getElementById('save-btn').addEventListener('click', saveCost);
    document.getElementById('nv-save').addEventListener('click', saveNaver);
  }

  async function saveCost(){
    const ym = document.getElementById('f-ym').value.trim();
    const channel = document.getElementById('f-channel').value.trim();
    const amount = Number(document.getElementById('f-amount').value);
    const msgSlot = document.getElementById('msg-slot');

    if(!/^\d{4}\.\d{2}$/.test(ym) || !channel || !amount){
      msgSlot.innerHTML = '<div class="msg err">연월(YYYY.MM)·채널명·금액을 확인해주세요.</div>';
      return;
    }
    const { error } = await db().from('marketing_cost_monthly')
      .upsert({ ym, channel, amount }, { onConflict: 'ym,channel' });
    if(error){
      msgSlot.innerHTML = `<div class="msg err">저장 실패: ${error.message}</div>`;
      return;
    }
    msgSlot.innerHTML = '<div class="msg ok">저장되었습니다.</div>';
    main();
  }


  async function saveNaver(){
    const g = id => document.getElementById(id).value;
    const month = g('nv-month').trim(), product = g('nv-product');
    const slot = document.getElementById('nv-msg');
    if(!/^\d{4}\.\d{2}$/.test(month)){ slot.innerHTML = '<div class="msg err">연월(YYYY.MM)을 확인해주세요.</div>'; return; }
    const n = id => Math.max(0, Math.round(Number(g(id))||0));
    const row = { month, product, impressions:n('nv-impr'), clicks:n('nv-clicks'), spend:n('nv-spend'),
                  conversions:n('nv-conv'), conversion_revenue:n('nv-convrev'), agency_fee_rate: Number(g('nv-fee'))||10 };
    const { error } = await db().from('marketing_naver_ads').upsert(row, { onConflict:'month,product' });
    if(error){ slot.innerHTML = `<div class="msg err">저장 실패: ${error.message}${/constraint|conflict/i.test(error.message)?' (sql/14_naver_ads_input.sql 실행이 필요합니다)':''}</div>`; return; }
    main();
    setTimeout(()=>{ const s2=document.getElementById('nv-msg'); if(s2) s2.innerHTML='<div class="msg ok">저장되었습니다.</div>'; },400);
  }

  WillyShell.requireRole(['owner','marketing'], main);
</script>
</body>
</html>

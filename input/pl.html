<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>손익 비용 입력 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#16a34a; --accent-light:#dcfce7; }
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;margin-bottom:14px;}
  .form-grid label{font-size:11.5px;font-weight:600;color:var(--willy-sub);display:block;margin-bottom:4px;}
  .form-grid input{width:100%;padding:8px 10px;border:1px solid #E4E4E7;border-radius:8px;font-family:inherit;font-size:13px;}
  .btn{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#15803d;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;white-space:nowrap;}
  th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  td{border-bottom:1px solid #f4f4f5;}
  td.num{text-align:right;} th.num{text-align:right;}
  .table-scroll{overflow-x:auto;}
  .msg{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .msg.ok{background:#DFEAFF;color:#1338BE;}
  .msg.err{background:#FFE1E8;color:#D81A3C;}
  .loading,.err-box{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'pl', title:'손익 비용 입력', subtitle:'기기매입비 · 설치도급비 · 기타(임대료 등)만 입력하면 나머지는 자동 계산됩니다'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const db = () => WillyShell.getAuthClient();
  const thisYm = () => { const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0'); };

  async function main(){
    const content = document.getElementById('content');
    try{
      const { data, error } = await db().from('pl_cost_monthly').select('*').order('ym',{ascending:false});
      if(error) throw error;
      render(data || []);
    }catch(err){
      content.innerHTML = `<div class="err-box">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function render(rows){
    const existing = rows.find(r=>r.ym===thisYm());

    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="panel">
        <h2>${thisYm()} 비용 입력</h2>
        <p class="panel-note">매출·인건비·광고비는 영업/인사/마케팅 데이터에서 자동으로 계산되어 손익 대시보드에 반영됩니다. 여기서는 아래 3개만 입력하세요.</p>
        <div id="msg-slot"></div>
        <div class="form-grid">
          <div><label>연월 (YYYY.MM)</label><input id="f-ym" type="text" value="${thisYm()}" /></div>
          <div><label>기기매입비(원)</label><input id="f-device" type="number" step="1" value="${existing?existing.device_cost:''}" /></div>
          <div><label>설치도급비(원)</label><input id="f-install" type="number" step="1" value="${existing?existing.install_fee:''}" /></div>
          <div><label>기타(임대료 등, 원)</label><input id="f-other" type="number" step="1" value="${existing?existing.other_cost:''}" /></div>
        </div>
        <button class="btn" id="save-btn">저장</button>
      </div>

      <div class="panel">
        <h2>입력 내역</h2>
        <div class="table-scroll">
        <table>
          <thead><tr><th>연월</th><th class="num">기기매입비</th><th class="num">설치도급비</th><th class="num">기타</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${r.ym}</td><td class="num">${won(r.device_cost)}원</td><td class="num">${won(r.install_fee)}원</td><td class="num">${won(r.other_cost)}원</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--willy-sub);">입력된 내역이 없습니다.</td></tr>'}
          </tbody>
        </table>
        </div>
      </div>
    `;

    document.getElementById('save-btn').addEventListener('click', saveCost);
  }

  async function saveCost(){
    const ym = document.getElementById('f-ym').value.trim();
    const device_cost = Number(document.getElementById('f-device').value) || 0;
    const install_fee = Number(document.getElementById('f-install').value) || 0;
    const other_cost = Number(document.getElementById('f-other').value) || 0;
    const msgSlot = document.getElementById('msg-slot');

    if(!/^\d{4}\.\d{2}$/.test(ym)){
      msgSlot.innerHTML = '<div class="msg err">연월 형식을 YYYY.MM으로 입력해주세요.</div>';
      return;
    }
    const { error } = await db().from('pl_cost_monthly')
      .upsert({ ym, device_cost, install_fee, other_cost }, { onConflict: 'ym' });
    if(error){
      msgSlot.innerHTML = `<div class="msg err">저장 실패: ${error.message}</div>`;
      return;
    }
    msgSlot.innerHTML = '<div class="msg ok">저장되었습니다.</div>';
    main();
  }

  WillyShell.requireRole(['owner'], main);
</script>
</body>
</html>

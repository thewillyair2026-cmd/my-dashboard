<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#141B3C">
<meta name="apple-mobile-web-app-title" content="WILLY">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>담당자별 상세 실적 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#1338BE; --accent-light:#DFEAFF; }
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  .card .barbg{background:#f4f4f5;border-radius:999px;height:6px;margin-top:10px;overflow:hidden;}
  .card .barfg{background:var(--accent);height:100%;border-radius:999px;}
  .trend-legend{display:flex;gap:16px;font-size:11px;color:var(--willy-sub);margin-top:8px;}
  .trend-legend span{display:inline-flex;align-items:center;gap:5px;}
  .trend-legend i{display:inline-block;width:12px;height:2px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:28px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:8px 6px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  tbody td{border-bottom:1px solid #f4f4f5;}
  tbody tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  #chan-table th:nth-child(5), #chan-table td:nth-child(5),
  #chan-table th:nth-child(8), #chan-table td:nth-child(8){border-left:1px solid #E4E4E7;}
  #chan-table thead tr:first-child th{text-align:center;background:#fafafa;}
  .bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .bar-track{width:60px;height:6px;border-radius:4px;background:#f4f4f5;overflow:hidden;flex-shrink:0;}
  .bar-fill{height:100%;border-radius:4px;background:var(--accent);}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  .confidential{font-size:11px;color:#D81A3C;background:#FFE1E8;display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:14px;}
  .rep-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .bonus-table th,.bonus-table td{white-space:nowrap;}
  .rep-card{display:block;background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:20px;text-decoration:none;color:var(--willy-text);font-weight:700;font-size:14px;text-align:center;transition:box-shadow .15s ease;}
  .rep-card:hover{box-shadow:0 8px 20px rgba(20,27,60,.10);}
  .back-link{display:inline-block;margin-bottom:16px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  @media (max-width:1100px){ .cards{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:860px){ .cards{grid-template-columns:repeat(2,1fr);} .rep-menu{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'sales', title:'담당자별 상세 실적', subtitle:'개인 면담용 · 본인 실적만 보여주세요'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const eok = n => {
    const sign = n<0?'-':'';
    n = Math.abs(Math.round(n));
    const eokPart = Math.floor(n/100000000);
    const manPart = Math.round((n%100000000)/10000);
    return sign + (eokPart>0?`${eokPart}억 `:'') + `${manPart.toLocaleString('ko-KR')}만원`;
  };
  const db = () => WillyShell.getAuthClient();

  const REPS = ['신제호 팀장','오형민 팀장','민대기 대리','이지은 실장','이유진 사원','정현수 대표','전윤진 대리'];
  const REP_TARGET_PER_MONTH = 150000000; // 담당자 월 목표: 1억5천만원

  // 조직 구성 (2026.10 기준)
  const ORG = {
    '정현수 대표':{org:'본부'},
    '신제호 팀장':{org:'고객영업팀', kind:'B2C', role:'팀장'},
    '전윤진 대리':{org:'고객영업팀', kind:'B2C', role:'팀원', join:'2026.09', career:true}, // 대리 이상 = 경력직, 사원 = 무경력 신입
    '이유진 사원':{org:'고객영업팀', kind:'B2C', role:'팀원', join:'2026.06', career:false},
    '오형민 팀장':{org:'제휴영업팀', kind:'B2B', role:'팀장'},
    '민대기 대리':{org:'제휴영업팀', kind:'B2B', role:'팀원', join:'2025.12', career:true},
    '이지은 실장':{org:'영업전략실', role:'실장'}
  };
  const TEAMS = { B2C:'고객영업팀', B2B:'제휴영업팀' };
  const BONUS_START = '2026.10';
  // 개인 월 목표(원): [비수기 9~2월, 성수기 3~8월]
  const BASE_TARGET = {
    B2C:{ '팀장':[250000000,280000000], '팀원':[150000000,180000000] },
    B2B:{ '팀장':[200000000,230000000], '팀원':[150000000,180000000] }
  };

  let personMonthly = [];
  const marginInput = {personal:'', team:''};

  function repFromUrl(){
    const r = new URLSearchParams(location.search).get('rep');
    return REPS.includes(r) ? r : null;
  }

  async function main(){
    const content = document.getElementById('content');
    const rep = repFromUrl();
    if(!rep){
      content.innerHTML = `
        <p style="font-size:12.5px;color:var(--willy-sub);margin:0 0 16px;">담당자를 선택하면 그 사람만의 전용 페이지로 이동합니다 (URL을 그대로 저장/공유해서 다음에 바로 열 수 있어요).</p>
        ${['고객영업팀','제휴영업팀','영업전략실','본부'].map(o=>`
          <div style="font-size:12px;font-weight:700;color:var(--willy-sub);margin:14px 0 8px;">${o}</div>
          <div class="rep-menu">
            ${REPS.filter(r=>ORG[r]&&ORG[r].org===o).map(r=>`<a class="rep-card" href="rep.html?rep=${encodeURIComponent(r)}">${r}</a>`).join('')}
          </div>`).join('')}
      `;
      return;
    }
    try{
      const { data, error } = await db().from('sales_rep_channel_monthly').select('*').eq('rep', rep);
      if(error) throw error;
      if(!data?.length) throw new Error('해당 담당자의 데이터가 비어 있습니다.');
      // 성과급 계산용: 전 직원 월별 실적(팀 합계 필요). 실패해도 페이지는 계속 표시
      const { data:rankData } = await db().from('sales_rank_monthly').select('name,ym,contracts,revenue').eq('kind','person');
      personMonthly = rankData || [];
      render(data, rep);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  // ---------- 성과급 (2026.10~ 시범운영, 마진 감액 전 추정치) ----------
  const monthIdx = ym => { const [y,m]=ym.split('.').map(Number); return y*12+m; };
  const isPeak = ym => { const m=Number(ym.split('.')[1]); return m>=3 && m<=8; };
  function adjFactor(name, ym){
    const c = ORG[name]; if(!c || !c.join) return 1;
    const n = monthIdx(ym)-monthIdx(c.join)+1;
    if(c.career) return n>=2 ? 1 : 0.4;
    return n>=4 ? 1 : (n>=2 ? 0.75 : 0.4);
  }
  function memberTarget(name, ym){
    const c = ORG[name];
    return BASE_TARGET[c.kind][c.role][isPeak(ym)?1:0] * adjFactor(name, ym);
  }
  function revOf(name, ym){
    return personMonthly.filter(r=>r.name===name && r.ym===ym).reduce((s,r)=>s+r.revenue,0);
  }
  function teamStat(kind, ym){
    const members = Object.keys(ORG).filter(n=>ORG[n].kind===kind);
    const rev = members.reduce((s,n)=>s+revOf(n,ym),0);
    const target = members.reduce((s,n)=>s+memberTarget(n,ym),0);
    return {rev, target, rate: target?rev/target:0};
  }
  const marginFactor = m => (m===null||isNaN(m)) ? 1 : m>=11.75?1 : m>=11.25?0.85 : m>=10.75?0.7 : m>=10.25?0.5 : 0;
  const parseMargin = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const fmtMan = n => Number.isInteger(n) ? n.toLocaleString('ko-KR') : n.toLocaleString('ko-KR',{maximumFractionDigits:1});

  function bonusMonth(rep, ym){
    const c = ORG[rep];
    if(c.role==='실장'){
      const b2c = teamStat('B2C', ym), b2b = teamStat('B2B', ym);
      const tier = r => r>=1.3?[30]:r>=1.2?[20]:r>=1.1?[15]:r>=1.0?[10]:[0];
      const base = (b2c.rate>=0.9 && b2b.rate>=0.9) ? 10 : 0;
      const l1 = tier(b2c.rate)[0], l2 = tier(b2b.rate)[0];
      return {type:'실장', b2c, b2b, base, l1, l2, total: base+l1+l2};
    }
    const target = memberTarget(rep, ym), rev = revOf(rep, ym), rate = target?rev/target:0;
    const leader = c.role==='팀장';
    const indiv = rate>=0.9 ? (leader?23:15) : rate>=0.8 ? (leader?8:5) : 0;
    const team = teamStat(c.kind, ym);
    let teamPay = 0;
    if(team.rate>=1 && rate>=0.8){
      const t = team.rate>=1.3?[40,60] : team.rate>=1.2?[30,45] : team.rate>=1.1?[20,30] : [10,15];
      teamPay = leader ? t[1] : t[0];
    }
    const mi = marginFactor(parseMargin(marginInput.personal)), mt = marginFactor(parseMargin(marginInput.team));
    return {type:'개인', rev, target, rate, indiv, team, teamPay, total: indiv+teamPay,
            adjTotal: indiv*mi + teamPay*mt, factor: adjFactor(rep, ym)};
  }

  function bonusPanel(rep, period){
    const c = ORG[rep];
    if(!c || c.org==='본부'){
      return `<div class="panel"><h2>성과급</h2><p class="panel-note">${c?c.org:''} 소속은 성과급(개인·팀) 대상이 아닙니다.</p></div>`;
    }
    const yms = [...new Set(personMonthly.map(r=>r.ym))].filter(y=>y>=BONUS_START).sort();
    const months = WillyShell.filterByPeriod(yms.map(y=>({ym:y})), period).map(m=>m.ym);
    if(!months.length){
      return `<div class="panel"><h2>성과급 예상</h2><p class="panel-note">성과급은 ${BONUS_START}부터 적용됩니다. 상단 기간에서 ${BONUS_START} 이후 월 또는 전체기간을 선택하세요.</p></div>`;
    }
    const list = months.map(ym=>({ym, ...bonusMonth(rep, ym)}));
    const hasMargin = parseMargin(marginInput.personal)!==null || parseMargin(marginInput.team)!==null;
    const sumTotal = list.reduce((s,x)=>s+x.total,0);
    const sumAdj = list.reduce((s,x)=>s+(x.adjTotal!==undefined?x.adjTotal:x.total),0);
    const pctTxt = r => (Math.round(r*1000)/10).toLocaleString('ko-KR')+'%';


    // 개인 목표 / 팀 목표 카드
    const barCard = (label, tgt, rev, extra) => {
      const rt = tgt ? rev/tgt : 0;
      return `<div class="card"><div class="label">${label}</div>
        <div class="value">${pctTxt(rt)}</div>
        <div class="barbg"><div class="barfg" style="width:${Math.min(rt*100,100)}%"></div></div>
        <div class="sub">목표 ${eok(tgt)} · 수주 ${eok(rev)}${extra?`<br>${extra}`:''}</div></div>`;
    };
    let goalCards = '';
    const single = list.length===1;
    if(c.role==='실장'){
      const t1 = list.reduce((a,x)=>a+x.b2c.target,0), r1 = list.reduce((a,x)=>a+x.b2c.rev,0);
      const t2 = list.reduce((a,x)=>a+x.b2b.target,0), r2 = list.reduce((a,x)=>a+x.b2b.rev,0);
      goalCards = `<div class="cards" style="grid-template-columns:repeat(2,1fr);">${barCard('고객영업팀(B2C) 팀 목표 달성률',t1,r1,'')}${barCard('제휴영업팀(B2B) 팀 목표 달성률',t2,r2,'')}</div>`;
    } else {
      const indT = list.reduce((a,x)=>a+x.target,0), indR = list.reduce((a,x)=>a+x.rev,0);
      const teamT = list.reduce((a,x)=>a+x.team.target,0), teamR = list.reduce((a,x)=>a+x.team.rev,0);
      let indNote = '', teamNote = '';
      if(single){
        const x = list[0];
        const need = th => Math.max(0, x.target*th - x.rev);
        indNote = x.rate>=0.9 ? '개인 90% 구간 달성 ✔' : x.rate>=0.8 ? `90%까지 ${eok(need(0.9))} 남음` : `80%까지 ${eok(need(0.8))} 남음`;
        const nextTeam = [1,1.1,1.2,1.3].find(t=>x.team.rate<t);
        teamNote = nextTeam ? `팀 ${Math.round(nextTeam*100)}%까지 ${eok(Math.max(0,x.team.target*nextTeam - x.team.rev))} 남음` : '팀 130% 구간 달성 ✔';
      }
      goalCards = `<div class="cards" style="grid-template-columns:repeat(2,1fr);">
        ${barCard('개인 목표 달성률 (조정 목표 기준)',indT,indR,indNote)}
        ${barCard(`팀 목표 달성률 (${c.org} 개인 목표 합계)`,teamT,teamR,teamNote)}</div>`;
    }

    let head, body;
    if(c.role==='실장'){
      head = '<th>월</th><th>고객영업팀 달성률</th><th>제휴영업팀 달성률</th><th>기본(두 팀 90%↑)</th><th>고객팀 연동</th><th>제휴팀 연동</th><th>합계(만원)</th>';
      body = list.map(x=>`<tr><td>${x.ym}</td><td>${pctTxt(x.b2c.rate)}</td><td>${pctTxt(x.b2b.rate)}</td><td>${x.base}</td><td>${x.l1}</td><td>${x.l2}</td><td><b>${x.total}</b></td></tr>`).join('');
    } else {
      head = '<th>월</th><th>개인 수주(부가세 별도)</th><th>조정 목표</th><th>달성률</th><th>개인 성과급</th><th>팀 달성률</th><th>팀 성과급</th><th>합계(만원)</th>'+(hasMargin?'<th>마진 감액 후</th>':'');
      body = list.map(x=>`<tr><td>${x.ym}${x.factor<1?` <span style="font-size:10.5px;color:var(--willy-sub);">(목표 ${Math.round(x.factor*100)}%)</span>`:''}</td>
        <td>${eok(x.rev)}</td><td>${eok(x.target)}</td><td>${pctTxt(x.rate)}</td><td>${x.indiv}</td>
        <td>${pctTxt(x.team.rate)}</td><td>${x.teamPay}</td><td><b>${x.total}</b></td>${hasMargin?`<td><b>${fmtMan(x.adjTotal)}</b></td>`:''}</tr>`).join('');
    }
    const marginUi = c.role==='실장' ? '' : `
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:12px;color:var(--willy-sub);">
        <span>마진 감액 시뮬레이션(선택):</span>
        <label>개인 마진율 <input id="m-personal" type="number" step="0.01" value="${marginInput.personal}" style="width:70px;padding:4px 6px;border:1px solid #E4E4E7;border-radius:6px;"> %</label>
        <label>팀 마진율 <input id="m-team" type="number" step="0.01" value="${marginInput.team}" style="width:70px;padding:4px 6px;border:1px solid #E4E4E7;border-radius:6px;"> %</label>
        <span>(기준 11.75% 미만이면 감액 · 입력값은 저장되지 않고 표시된 모든 월에 동일 적용)</span>
      </div>`;
    return `
      <div class="panel">
        <h2>성과급 예상 <span style="font-size:12px;font-weight:400;color:var(--willy-sub);">(${c.org}${c.kind?' · '+c.kind:''} · ${c.role})</span></h2>
        <p class="panel-note">${BONUS_START}~ 시범운영 · 계약일 기준 공급가액(부가세 제외) · <b>마진 감액 전 추정치</b> · 카드 3%·상품권·소개수수료·미수 제외는 반영되지 않았고 취소 건만 제외된 금액 기준 · 실장의 신사업(전열교환기) 분기 보상은 별도 계산</p>
        <div style="font-size:13px;margin-bottom:10px;">${list.length>1?`${months[0]}~${months[months.length-1]} 합계`:`${months[0]}`} 예상 성과급 <b style="font-size:18px;color:var(--accent);">${fmtMan(sumTotal)}만원</b>${hasMargin?` <span style="color:var(--willy-sub);">→ 마진 감액 후 <b>${fmtMan(sumAdj)}만원</b></span>`:''}</div>
        ${goalCards}
        ${marginUi}
        <div class="table-scroll"><table class="bonus-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      </div>`;
  }

  function periodLabel(period){
    if(period==='ALL') return '전체기간';
    if(period.indexOf('YEAR:')===0) return period.slice(5)+'년 전체';
    return period;
  }

  function render(all, rep){
    let period = 'ALL';

    function renderBody(){
      const repRows = all;
      const monthly = {};
      repRows.forEach(r=>{
        if(!monthly[r.ym]) monthly[r.ym] = {ym:r.ym, quotes:0, contracts:0, revenue:0};
        monthly[r.ym].quotes += r.quotes;
        monthly[r.ym].contracts += r.contracts;
        monthly[r.ym].revenue += r.revenue;
      });
      const monthlyList = Object.values(monthly).sort((a,b)=>a.ym.localeCompare(b.ym));
      const periods = WillyShell.buildPeriodOptions(monthlyList);

      const periodRows = WillyShell.filterByPeriod(monthlyList, period);
      const periodQ = periodRows.reduce((s,m)=>s+m.quotes,0);
      const periodC = periodRows.reduce((s,m)=>s+m.contracts,0);
      const periodRev = periodRows.reduce((s,m)=>s+m.revenue,0);
      const rate = periodQ ? periodC/periodQ*100 : 0;
      const avgDeal = periodC ? periodRev/periodC : 0;
      const allC = monthlyList.reduce((a,m)=>a+m.contracts,0), allRev = monthlyList.reduce((a,m)=>a+m.revenue,0);
      const allAvgDeal = allC ? allRev/allC : 0;
      const monthTarget = ym => (ORG[rep] && ORG[rep].kind && ym>=BONUS_START) ? memberTarget(rep, ym) : REP_TARGET_PER_MONTH;
      const periodTarget = periodRows.length ? periodRows.reduce((t,m)=>t+monthTarget(m.ym),0) : REP_TARGET_PER_MONTH;
      const achieveRate = periodTarget ? periodRev/periodTarget*100 : 0;

      function channelAgg(rows){
        const agg = {};
        rows.forEach(r=>{
          if(!agg[r.channel]) agg[r.channel] = {channel:r.channel, quotes:0, contracts:0, revenue:0};
          agg[r.channel].quotes += r.quotes;
          agg[r.channel].contracts += r.contracts;
          agg[r.channel].revenue += r.revenue;
        });
        return agg;
      }
      function withRate(agg){
        const out = {};
        Object.keys(agg).forEach(k=>{
          const c = agg[k];
          out[k] = {...c, rate: c.quotes ? c.contracts/c.quotes*100 : 0};
        });
        return out;
      }

      const isSingleMonth = period!=='ALL' && period.indexOf('YEAR:')!==0;

      const periodChanRows = repRows.filter(r=>{
        if(period==='ALL') return true;
        if(period.indexOf('YEAR:')===0) return r.ym.startsWith(period.slice(5)+'.');
        return r.ym===period;
      });
      const chanAgg = withRate(channelAgg(periodChanRows));
      const chanList = Object.values(chanAgg).sort((a,b)=>b.revenue-a.revenue);
      const topChannel = chanList[0];
      const maxRev = Math.max(...chanList.map(c=>c.revenue), 1);

      // 연간 누적 월평균: 연초 ~ "기준 달"까지 누적 실적 ÷ 개월수. 단일 월 선택 시 기준 달 = 선택한 달,
      // 연도/전체기간 선택 시에는 데이터상 가장 최근 달을 기준으로 사용
      let throughYm;
      if(isSingleMonth) throughYm = period;
      else if(period.indexOf('YEAR:')===0){
        const y = period.slice(5);
        const yms = monthlyList.filter(m=>m.ym.startsWith(y+'.')).map(m=>m.ym);
        throughYm = yms.length ? yms[yms.length-1] : null;
      } else {
        throughYm = monthlyList.length ? monthlyList[monthlyList.length-1].ym : null;
      }
      const throughYear = throughYm ? throughYm.split('.')[0] : null;
      const ytdYms = throughYm ? monthlyList.filter(m=>m.ym.startsWith(throughYear+'.') && m.ym<=throughYm).map(m=>m.ym) : [];
      const yearMonthCount = Math.max(ytdYms.length, 1);
      const annualAgg = withRate(channelAgg(repRows.filter(r=>ytdYms.includes(r.ym))));
      const latestYear = throughYear;

      // 직전월 = 선택한 월의 바로 전달. 연도/전체기간 선택 시에는 데이터상 가장 최근 달의 전달을 기본값으로 사용
      let lastYm = null;
      if(isSingleMonth){
        const idx = monthlyList.findIndex(m=>m.ym===period);
        lastYm = idx>0 ? monthlyList[idx-1].ym : null;
      } else {
        lastYm = monthlyList.length>1 ? monthlyList[monthlyList.length-2].ym : null;
      }
      const lastMonthAgg = withRate(channelAgg(repRows.filter(r=>r.ym===lastYm)));

      // 채널 표 정렬은 선택 기간과 무관하게 전체기간 매출 기준으로 고정 (달 바꿔도 줄 순서가 안 바뀌게)
      const allTimeAgg = channelAgg(repRows);
      const allChannels = [...new Set([...Object.keys(chanAgg), ...Object.keys(annualAgg), ...Object.keys(lastMonthAgg)])]
        .sort((a,b)=>(allTimeAgg[b]?.revenue||0)-(allTimeAgg[a]?.revenue||0));

      const label = periodLabel(period);
      const content = document.getElementById('content');
      content.innerHTML = `
        <a class="back-link" href="rep.html">← 담당자 목록으로</a>
        <div class="confidential">개인정보 — ${rep} 본인 면담 시에만 화면 공유하세요</div>
        <h1 style="font-size:18px;margin:0 0 16px;">${rep}</h1>

        <div class="cards">
          <div class="card">
            <div class="label">${label} 계약금액 <span style="font-weight:400;">(부가세 별도)</span></div>
            <div class="value big">${eok(periodRev)}</div>
            <div class="sub">견적 ${won(periodQ)}건 · 계약 ${won(periodC)}건</div>
          </div>
          <div class="card">
            <div class="label">목표 대비 달성률</div>
            <div class="value">${pct(achieveRate)}%</div>
            <div class="barbg"><div class="barfg" style="width:${Math.min(achieveRate,100)}%"></div></div>
            <div class="sub">목표 ${eok(periodTarget)} (${BONUS_START} 이후는 직책·시즌별 개인 목표, 이전은 월 1억5천만원)</div>
          </div>
          <div class="card">
            <div class="label">${label} 견적→계약 전환율</div>
            <div class="value">${pct(rate)}%</div>
          </div>
          <div class="card">
            <div class="label">${label} 평균 계약단가 <span style="font-weight:400;">(부가세 별도)</span></div>
            <div class="value">${periodC?won(Math.round(avgDeal/10000))+'만원':'-'}</div>
            <div class="sub">계약 ${won(periodC)}건 기준${period!=='ALL'&&allAvgDeal?` · 전체기간 ${won(Math.round(allAvgDeal/10000))}만원`:''}</div>
          </div>
          <div class="card">
            <div class="label">최다 유입 채널</div>
            <div class="value">${topChannel?topChannel.channel:'-'}</div>
            <div class="sub">${topChannel?`${eok(topChannel.revenue)}`:'데이터 없음'}</div>
          </div>
        </div>

        ${bonusPanel(rep, period)}

        <div class="panel">
          <h2>월별 계약금액 추이</h2>
          <p class="panel-note">${rep} · 계약일 기준</p>
          ${trendChart(monthlyList, period)}
        </div>

        <div class="panel">
          <h2>채널별 실적</h2>
          <p class="panel-note">${rep} 담당 건 기준 · 선택 기간(${label}) / ${latestYear?latestYear+'년 1월~'+(throughYm?throughYm.split('.')[1]+'월 누적평균':''):'-'} / 직전월(${lastYm||'-'}) 비교</p>
          <div class="table-scroll">
          <table id="chan-table">
            <thead>
              <tr>
                <th rowspan="2">채널</th>
                <th colspan="3">${label}</th>
                <th colspan="3">${latestYear||'-'}년 누적 월평균</th>
                <th colspan="3">직전월(${lastYm||'-'})</th>
              </tr>
              <tr>
                <th>견적</th><th>계약</th><th>전환율</th>
                <th>견적</th><th>계약</th><th>전환율</th>
                <th>견적</th><th>계약</th><th>전환율</th>
              </tr>
            </thead>
            <tbody>
              ${allChannels.map(ch=>{
                const cur = chanAgg[ch] || {quotes:0, contracts:0, rate:0};
                const ann = annualAgg[ch] || {quotes:0, contracts:0, rate:0};
                const lm = lastMonthAgg[ch] || {quotes:0, contracts:0, rate:0};
                const annQ = ann.quotes/yearMonthCount, annC = ann.contracts/yearMonthCount;
                return `
                <tr>
                  <td>${ch}</td>
                  <td>${won(cur.quotes)}</td>
                  <td>${won(cur.contracts)}</td>
                  <td>${pct(cur.rate)}%</td>
                  <td>${pct(annQ)}</td>
                  <td>${pct(annC)}</td>
                  <td>${pct(ann.rate)}%</td>
                  <td>${won(lm.quotes)}</td>
                  <td>${won(lm.contracts)}</td>
                  <td>${pct(lm.rate)}%</td>
                </tr>`;}).join('') || '<tr><td colspan="10" style="color:var(--willy-sub);">해당 기간 실적이 없습니다.</td></tr>'}
            </tbody>
          </table>
          </div>
        </div>
      `;

      ['m-personal','m-team'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.addEventListener('change', ()=>{ marginInput.personal = (document.getElementById('m-personal')||{}).value||''; marginInput.team = (document.getElementById('m-team')||{}).value||''; renderBody(); });
      });
      WillyShell.setPeriodFilter(periods, period, (p)=>{ period = p; renderBody(); });
    }

    renderBody();
  }

  function movingAvg3(monthly){
    return monthly.map((m,i)=>{
      const window = monthly.slice(Math.max(0,i-2), i+1);
      const avg = window.reduce((s,w)=>s+w.revenue,0)/window.length;
      return avg;
    });
  }

  function trendChart(monthly, period){
    if(!monthly.length) return '<div style="font-size:12px;color:var(--willy-sub);">데이터가 없습니다.</div>';
    const W=760,H=220,padL=48,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const avgSeries = movingAvg3(monthly);
    const maxV = Math.max(...monthly.map(m=>m.revenue), ...avgSeries, 1)*1.1;
    const step = innerW/monthly.length;
    const bw = step*0.5;
    const isSelected = ym => period==='ALL' || (period.indexOf('YEAR:')===0 && ym.startsWith(period.slice(5)+'.')) || period===ym;
    const bars = monthly.map((m,i)=>{
      const x = padL+step*i+(step-bw)/2;
      const h = m.revenue/maxV*innerH;
      const y = padT+innerH-h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${isSelected(m.ym)?'var(--accent)':'var(--accent-light)'}"></rect>`;
    }).join('');
    const avgPoints = avgSeries.map((v,i)=>{
      const x = padL+step*i+step/2;
      const y = padT+innerH-(v/maxV*innerH);
      return `${x},${y}`;
    }).join(' ');
    const labels = monthly.map((m,i)=>{
      const x = padL+step*i+step/2;
      return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--willy-sub)">${m.ym.slice(2)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      ${bars}
      <polyline points="${avgPoints}" fill="none" stroke="#D81A3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${labels}
    </svg>
    <div class="trend-legend">
      <span><i style="background:var(--accent)"></i>월별 계약금액</span>
      <span><i style="background:#D81A3C"></i>3개월 이동평균</span>
    </div>`;
  }

  WillyShell.requireRole(['owner','marketing'], main);
</script>
</body>
</html>

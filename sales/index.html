<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영업 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#1338BE; --accent-light:#DFEAFF; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:28px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .card .barbg{background:#f4f4f5;border-radius:999px;height:6px;margin-top:10px;overflow:hidden;}
  .card .barfg{background:var(--accent);height:100%;border-radius:999px;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;}
  .period-select{font-family:inherit;font-size:12px;color:var(--willy-text);font-weight:600;padding:5px 10px;border:1px solid #E4E4E7;border-radius:8px;background:#fff;cursor:pointer;}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .rank-row .name{width:110px;font-size:13px;flex-shrink:0;}
  .rank-bar-bg{flex:1;background:#f4f4f5;border-radius:999px;height:10px;overflow:hidden;}
  .rank-bar-fg{height:100%;background:var(--accent);border-radius:999px;}
  .rank-row .amt{width:90px;text-align:right;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .brand-row .rank-bar-fg.lg{background:var(--willy-lg);}
  .brand-row .rank-bar-fg.sm{background:var(--willy-sm);}
  .funnel-step{margin-bottom:2px;}
  .funnel-bar{background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;color:#fff;font-size:13px;}
  .funnel-conv{text-align:center;font-size:11px;color:var(--willy-sub);padding:4px 0;}
  .funnel-final{margin-top:10px;padding:10px;background:var(--accent-light);border-radius:10px;text-align:center;font-size:13px;}
  .funnel-final b{color:var(--accent);}
  .b2b-legend{display:flex;gap:16px;font-size:11px;color:var(--willy-sub);margin-top:8px;}
  .b2b-legend span{display:inline-flex;align-items:center;gap:4px;}
  .b2b-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;}
  .insight-list{display:flex;flex-direction:column;gap:10px;}
  .insight-item{display:flex;gap:12px;padding:12px 14px;background:var(--accent-light);border-radius:10px;}
  .insight-item .num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .insight-item .txt strong{display:block;font-size:13px;margin-bottom:2px;}
  .insight-item .txt span{font-size:12px;color:var(--willy-sub);}
  .table-scroll{overflow-x:auto;}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  const SUPABASE_URL = 'https://gsqurjwbdkenmjwspucq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcXVyandiZGtlbm1qd3NwdWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTY3MjIsImV4cCI6MjEwMjEzMjcyMn0.VWwpg2uLfFWquknfnKjsj6a_-AfTdQJS8LVw9dSQ0xo';

  WillyShell.mount({active:'sales', title:'영업 대시보드', subtitle:'답하는 질문 — 이번 달 목표까지 얼마나 남았나? B2B/B2C 어디서 벌고 있나?'});

  const { createClient } = supabase;
  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const eok = n => {
    const sign = n<0?'-':'';
    n = Math.abs(Math.round(n));
    const eokPart = Math.floor(n/100000000);
    const manPart = Math.round((n%100000000)/10000);
    return sign + (eokPart>0?`${eokPart}억 `:'') + `${manPart.toLocaleString('ko-KR')}만원`;
  };

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const [{data:monthly,error:e1},{data:pipeline,error:e2},{data:rank,error:e3},{data:dealType,error:e4},{data:dealMonthly,error:e5},{data:rankMonthly,error:e6}] = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order',{ascending:true}),
        db.from('sales_pipeline').select('*').order('sort_order',{ascending:true}),
        db.from('sales_rank').select('*'),
        db.from('sales_deal_type').select('*'),
        db.from('sales_deal_type_monthly').select('*').order('sort_order',{ascending:true}),
        db.from('sales_rank_monthly').select('*')
      ]);
      const err = e1||e2||e3||e4||e5||e6;
      if(err) throw err;
      if(!monthly?.length||!pipeline?.length||!rank?.length||!dealType?.length||!dealMonthly?.length||!rankMonthly?.length) throw new Error('데이터가 비어 있습니다.');
      let selectedYm = monthly[monthly.length-1].ym;
      WillyShell.setMonthFilter(monthly.map(m=>m.ym), selectedYm, (m)=>{ selectedYm = m; render(monthly, pipeline, rank, dealType, dealMonthly, rankMonthly, selectedYm); });
      render(monthly, pipeline, rank, dealType, dealMonthly, rankMonthly, selectedYm);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  const ACTIVE_STAFF = new Set(['신제호 과장','오형민 대리','정현수 대표','민대기 대리','김지연 주임','서은지 주임','이유진 사원','이지은 대리']);

  function render(monthly, pipeline, rank, dealType, dealMonthly, rankMonthly, selectedYm){
    const idx = monthly.findIndex(m=>m.ym===selectedYm);
    const thisM = monthly[idx>=0?idx:monthly.length-1];
    const achieveRate = thisM.target ? thisM.revenue/thisM.target*100 : 0;

    // 최근 12개월(있는 만큼) 누적
    const last12 = monthly.slice(-12);
    const cum12 = last12.reduce((s,m)=>s+m.revenue,0);

    const totalDeal = dealType.reduce((s,d)=>s+d.revenue,0);
    const b2b = dealType.find(d=>d.kind==='B2B') || {revenue:0,count:0};
    const b2bRate = totalDeal ? b2b.revenue/totalDeal*100 : 0;

    const prevM = idx>0 ? monthly[idx-1] : null;
    const momRate = prevM && prevM.revenue ? (thisM.revenue-prevM.revenue)/prevM.revenue*100 : null;

    const periods = buildPeriodOptions(rankMonthly);
    const defaultPeriod = 'ALL';

    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="cards">
        <div class="card">
          <div class="label">${selectedYm} 계약금액</div>
          <div class="value big">${eok(thisM.revenue)}</div>
          <div class="barbg"><div class="barfg" style="width:${Math.min(achieveRate,100)}%"></div></div>
          <div class="sub">목표 ${eok(thisM.target)} 대비 ${pct(achieveRate)}%</div>
        </div>
        <div class="card">
          <div class="label">최근 12개월 누적</div>
          <div class="value">${eok(cum12)}</div>
          <div class="sub">계약금액 합계</div>
        </div>
        <div class="card">
          <div class="label">B2B 매출 비중</div>
          <div class="value">${pct(b2bRate)}%</div>
          <div class="sub">${eok(b2b.revenue)} · ${won(b2b.count)}건 (인테리어·부동산 제휴)</div>
        </div>
        <div class="card">
          <div class="label">전월 대비 증감률</div>
          <div class="value" style="color:${momRate===null?'var(--willy-text)':(momRate>=0?'#16a34a':'#dc2626')}">${momRate===null?'-':(momRate>=0?'+':'')+pct(momRate)+'%'}</div>
          <div class="sub">${prevM?`${prevM.ym} 대비 ${selectedYm}`:'전월 데이터 없음'}</div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>월별 계약금액 추이</h2>
          <p class="panel-note">연.월 기준 · 계약일 기준 집계</p>
          ${revenueChart(monthly, selectedYm)}
        </div>
        <div class="panel">
          <h2>영업 퍼널</h2>
          <p class="panel-note">전체 기간 누적 · 계약~설치완료 사이 이탈 = 취소</p>
          ${funnel(pipeline)}
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <div class="panel-head">
            <h2>담당자별 실적</h2>
            <select class="period-select" id="period-select">
              ${periods.map(p=>`<option value="${p.value}"${p.value===defaultPeriod?' selected':''}>${p.label}</option>`).join('')}
            </select>
          </div>
          <p class="panel-note" id="person-note">전체기간은 현재 재직 중인 담당자만 · 월/연도 선택 시 퇴사자 포함</p>
          <div id="person-rank-body">${personRankList(aggregateRank(rankMonthly,'person',defaultPeriod))}</div>
        </div>
        <div class="panel">
          <h2>브랜드별 실적</h2>
          <p class="panel-note">실외기 모델코드 기준 근사 분류 · 왼쪽과 같은 기간</p>
          <div id="brand-rank-body">${brandRankList(aggregateRank(rankMonthly,'brand',defaultPeriod))}</div>
        </div>
      </div>

      <div class="panel">
        <h2>B2B / B2C 월별 계약 추이</h2>
        <p class="panel-note">인테리어·부동산 제휴 채널 = B2B, 나머지 = B2C</p>
        ${b2bChart(dealMonthly)}
      </div>
    `;

    document.getElementById('period-select').addEventListener('change', (e)=>{
      const period = e.target.value;
      document.getElementById('person-rank-body').innerHTML = personRankList(aggregateRank(rankMonthly,'person',period));
      document.getElementById('brand-rank-body').innerHTML = brandRankList(aggregateRank(rankMonthly,'brand',period));
      document.getElementById('person-note').textContent = period==='ALL' ? '전체기간은 현재 재직 중인 담당자만 · 월/연도 선택 시 퇴사자 포함' : '선택한 기간에 활동한 담당자 전체(퇴사자 포함) 표시';
    });
  }

  function buildPeriodOptions(rankMonthly){
    const yms = [...new Set(rankMonthly.map(r=>r.ym))].sort();
    const years = [...new Set(yms.map(y=>y.split('.')[0]))];
    const opts = [{value:'ALL', label:'전체기간'}];
    years.forEach(y=>opts.push({value:'YEAR:'+y, label:y+'년 전체'}));
    yms.forEach(ym=>opts.push({value:ym, label:ym}));
    return opts;
  }

  function aggregateRank(rankMonthly, kind, period){
    let rows = rankMonthly.filter(r=>r.kind===kind);
    if(period==='ALL'){
      if(kind==='person') rows = rows.filter(r=>ACTIVE_STAFF.has(r.name));
    } else if(period.startsWith('YEAR:')){
      const y = period.slice(5);
      rows = rows.filter(r=>r.ym.startsWith(y+'.'));
    } else {
      rows = rows.filter(r=>r.ym===period);
    }
    const agg = {};
    rows.forEach(r=>{
      if(!agg[r.name]) agg[r.name] = {name:r.name, amount:0};
      agg[r.name].amount += r.revenue;
    });
    return Object.values(agg).filter(a=>a.amount>0).sort((a,b)=>b.amount-a.amount);
  }

  function personRankList(items){
    if(!items.length) return '<div style="font-size:12px;color:var(--willy-sub);padding:8px 0;">해당 기간 실적이 없습니다.</div>';
    const max = Math.max(...items.map(i=>i.amount));
    return items.map(i=>`
      <div class="rank-row">
        <div class="name">${i.name}</div>
        <div class="rank-bar-bg"><div class="rank-bar-fg" style="width:${i.amount/max*100}%"></div></div>
        <div class="amt">${eok(i.amount)}</div>
      </div>`).join('');
  }

  function brandRankList(items){
    if(!items.length) return '<div style="font-size:12px;color:var(--willy-sub);padding:8px 0;">해당 기간 실적이 없습니다.</div>';
    const max = Math.max(...items.map(i=>i.amount));
    return items.map(i=>{
      const isLG = i.name.includes('LG');
      return `<div class="rank-row brand-row">
        <div class="name">${i.name}</div>
        <div class="rank-bar-bg"><div class="rank-bar-fg ${isLG?'lg':'sm'}" style="width:${i.amount/max*100}%"></div></div>
        <div class="amt">${eok(i.amount)}</div>
      </div>`;
    }).join('');
  }

  function funnel(pipeline){
    const maxCount = pipeline[0].count;
    let html = '';
    pipeline.forEach((p,i)=>{
      const widthPct = 40 + (p.count/maxCount)*60;
      html += `<div class="funnel-step">
        <div class="funnel-bar" style="width:${widthPct}%;margin:0 auto;">
          <span>${p.stage}</span><span>${won(p.count)}건</span>
        </div>
      </div>`;
      if(i < pipeline.length-1){
        const conv = pipeline[i+1].count/p.count*100;
        html += `<div class="funnel-conv">↓ 전환율 ${pct(conv)}%</div>`;
      }
    });
    const finalRate = pipeline[pipeline.length-1].count/pipeline[0].count*100;
    html += `<div class="funnel-final">최종 전환율 = <b>${pct(finalRate)}%</b> (${pipeline[0].stage} → ${pipeline[pipeline.length-1].stage})</div>`;
    return html;
  }

  function revenueChart(monthly, selectedYm){
    const W=520,H=240,padL=48,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const maxV = Math.max(...monthly.map(m=>Math.max(m.revenue,m.target)))*1.1;
    const step = innerW/monthly.length;
    const bw = step*0.5;

    const selM = monthly.find(m=>m.ym===selectedYm) || monthly[monthly.length-1];
    const targetY = padT + innerH - (selM.target/maxV*innerH);

    const bars = monthly.map((m,i)=>{
      const x = padL+step*i+(step-bw)/2;
      const h = m.revenue/maxV*innerH;
      const y = padT+innerH-h;
      const isSelected = m.ym===selectedYm;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${isSelected?'var(--accent)':'var(--accent-light)'}"></rect>`;
    }).join('');
    const labels = monthly.map((m,i)=>{
      const x = padL+step*i+step/2;
      return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--willy-sub)">${m.ym.slice(2)}</text>`;
    }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      <line x1="${padL}" y1="${targetY}" x2="${W-padR}" y2="${targetY}" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="${W-padR}" y="${targetY-6}" text-anchor="end" font-size="10" fill="var(--willy-sub)">목표</text>
      ${bars}${labels}
    </svg>`;
  }

  function b2bChart(dealMonthly){
    const W=1000,H=240,padL=40,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const maxV = Math.max(...dealMonthly.map(m=>m.b2b_count+m.b2c_count))*1.15;
    const step = innerW/dealMonthly.length;
    const bw = step*0.55;
    const yOf = v => innerH*(1-v/maxV);

    const bars = dealMonthly.map((m,i)=>{
      const x = padL+step*i+(step-bw)/2;
      const b2cH = m.b2c_count/maxV*innerH;
      const b2bH = m.b2b_count/maxV*innerH;
      const b2cY = padT+innerH-b2cH;
      const b2bY = b2cY-b2bH;
      return `<rect x="${x}" y="${b2cY}" width="${bw}" height="${b2cH}" fill="var(--willy-navy)" opacity="0.18"></rect>
              <rect x="${x}" y="${b2bY}" width="${bw}" height="${b2bH}" fill="var(--willy-navy)"></rect>`;
    }).join('');
    const labels = dealMonthly.map((m,i)=>{
      const x = padL+step*i+step/2;
      return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--willy-sub)">${m.ym.slice(2)}</text>`;
    }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      ${bars}${labels}
    </svg>
    <div class="b2b-legend">
      <span><i style="background:var(--willy-navy)"></i>B2B</span>
      <span><i style="background:var(--willy-navy);opacity:.18"></i>B2C</span>
    </div>`;
  }

  main();
</script>
</body>
</html>

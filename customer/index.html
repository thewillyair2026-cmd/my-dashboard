<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고객 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#0d9488; --accent-light:#99f6e4; --accent-bg:#f0fdfa; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:30px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .card .sub.good{color:#16a34a;} .card .sub.bad{color:#dc2626;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;}
  .table-scroll{overflow-x:auto;}
  table.cohort{border-collapse:collapse;font-size:12px;width:100%;}
  table.cohort th{color:var(--willy-sub);font-weight:500;padding:6px 8px;text-align:center;}
  table.cohort th:first-child,table.cohort td:first-child{text-align:left;color:var(--willy-sub);}
  table.cohort td{text-align:center;padding:4px;}
  .cohort-cell{border-radius:6px;padding:6px 0;font-weight:600;}
  .cohort-empty{color:#d4d4d8;}
  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .donut-legend{font-size:12px;flex:1;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f4f5;}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .legend-name{color:var(--willy-sub);}
  .avg-box{margin-top:10px;padding:10px;background:var(--accent-bg);border-radius:10px;font-size:12px;color:var(--willy-sub);}
  .avg-box b{color:var(--accent);font-size:15px;}
  .partner-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
  .partner-row .name{width:110px;flex-shrink:0;font-size:13px;}
  .partner-bar-bg{flex:1;background:#f4f4f5;border-radius:999px;height:10px;overflow:hidden;}
  .partner-bar-fg{height:100%;background:var(--accent);border-radius:999px;}
  .partner-row .val{width:80px;text-align:right;font-size:12px;color:var(--willy-sub);}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
    .donut-wrap{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  const SUPABASE_URL = 'https://gsqurjwbdkenmjwspucq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcXVyandiZGtlbm1qd3NwdWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTY3MjIsImV4cCI6MjEwMjEzMjcyMn0.VWwpg2uLfFWquknfnKjsj6a_-AfTdQJS8LVw9dSQ0xo';

  WillyShell.mount({active:'customer', title:'고객 대시보드', subtitle:'답하는 질문 — B2C는 잘 설치되고 있나? B2B 파트너사는 계속 재발주하나?'});

  const { createClient } = supabase;
  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const [{data:summary,error:e1},{data:cohort,error:e2},{data:partners,error:e3},{data:type,error:e4}] = await Promise.all([
        db.from('customer_summary').select('*').order('sort_order',{ascending:true}),
        db.from('customer_as_cohort').select('*').order('sort_order',{ascending:true}),
        db.from('b2b_partners').select('*'),
        db.from('customer_type').select('*')
      ]);
      const err = e1||e2||e3||e4;
      if(err) throw err;
      if(!summary?.length||!cohort?.length||!partners?.length||!type?.length) throw new Error('데이터가 비어 있습니다.');
      render(summary, cohort, partners, type);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function render(summary, cohort, partners, type){
    const thisM = summary[summary.length-1];
    const prevM = summary.length>1 ? summary[summary.length-2] : null;
    const asDiff = prevM ? thisM.as_rate - prevM.as_rate : null;
    const dealDiff = prevM ? thisM.avg_deal - prevM.avg_deal : null;

    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="cards">
        <div class="card">
          <div class="label">이번 달 신규 설치</div>
          <div class="value big">${won(thisM.new_customers)}건</div>
          <div class="sub">B2C+B2B 합산</div>
        </div>
        <div class="card">
          <div class="label">AS 발생률</div>
          <div class="value">${pct(thisM.as_rate)}%</div>
          <div class="sub ${asDiff===null?'':(asDiff<=0?'good':'bad')}">${asDiff===null?'전월 데이터 없음':(asDiff<=0?`전월 대비 ${pct(Math.abs(asDiff))}%p 개선`:`전월 대비 +${pct(asDiff)}%p 악화`)}</div>
        </div>
        <div class="card">
          <div class="label">평균 계약단가</div>
          <div class="value">${won(thisM.avg_deal)}만원</div>
          <div class="sub ${dealDiff===null?'':(dealDiff>=0?'good':'bad')}">${dealDiff===null?'전월 데이터 없음':(dealDiff>=0?`전월 대비 +${won(dealDiff)}만원`:`전월 대비 -${won(-dealDiff)}만원`)}</div>
        </div>
        <div class="card">
          <div class="label">활성 B2B 파트너사</div>
          <div class="value">${won(thisM.active_partners)}곳</div>
          <div class="sub">부동산·인테리어 등 재발주 거래처</div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>설치 후 AS 발생 시점 (무AS 유지율)</h2>
          <div class="table-scroll">
          ${cohortTable(cohort)}
          </div>
        </div>
        <div class="panel">
          <h2>거래 구성</h2>
          ${compositionDonut(type, thisM)}
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>B2B 파트너사 TOP</h2>
          ${partnerList(partners)}
        </div>
        <div class="panel">
          <h2>월별 AS 발생률 추이</h2>
          ${asChart(summary)}
        </div>
      </div>
    `;
  }

  function cohortTable(cohort){
    const months = [...new Set(cohort.map(c=>c.install_month))];
    const maxAfter = Math.max(...cohort.map(c=>c.months_after));
    const cols = Array.from({length:maxAfter+1},(_,i)=>i);
    const get = (m,after) => cohort.find(c=>c.install_month===m && c.months_after===after);
    return `<table class="cohort">
      <thead><tr><th>설치월</th>${cols.map(c=>`<th>M+${c}</th>`).join('')}</tr></thead>
      <tbody>
        ${months.map(m=>`
          <tr>
            <td>${m}</td>
            ${cols.map(c=>{
              const rec = get(m,c);
              if(!rec) return `<td class="cohort-empty">–</td>`;
              const alpha = 0.12 + (rec.issue_free_rate/100)*0.8;
              const light = rec.issue_free_rate < 90;
              return `<td><div class="cohort-cell" style="background:rgba(13,148,136,${alpha});color:${light?'#134e4a':'#fff'}">${rec.issue_free_rate}%</div></td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>`;
  }

  function compositionDonut(type, thisM){
    const total = type.reduce((s,t)=>s+t.count,0) || 1;
    const colors = {'B2C 신규':'#0d9488','B2B 신규':'#5eead4','B2B 재발주':'#134e4a'};
    const size=160,r=60,cx=size/2,cy=size/2,sw=24;
    const circumference = 2*Math.PI*r;
    let offset=0;
    const arcs = type.map(t=>{
      const frac = t.count/total;
      const dash = frac*circumference;
      const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[t.kind]||'#ccc'}" stroke-width="${sw}"
        stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += dash;
      return el;
    }).join('');

    return `<div class="donut-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${arcs}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="700" fill="var(--willy-text)">${won(total)}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">총 설치건수</text>
      </svg>
      <div class="donut-legend">
        ${type.map(t=>`
          <div class="legend-row">
            <span><span class="legend-dot" style="background:${colors[t.kind]||'#ccc'}"></span><span class="legend-name">${t.kind}</span></span>
            <span>${won(t.count)}건</span>
          </div>`).join('')}
        <div class="avg-box">평균 계약단가<br><b>${won(thisM.avg_deal)}만원</b></div>
      </div>
    </div>`;
  }

  function partnerList(partners){
    const sorted = partners.sort((a,b)=>b.revenue-a.revenue);
    const max = Math.max(...sorted.map(p=>p.revenue));
    return sorted.map(p=>`
      <div class="partner-row">
        <div class="name">${p.partner_name}</div>
        <div class="partner-bar-bg"><div class="partner-bar-fg" style="width:${p.revenue/max*100}%"></div></div>
        <div class="val">${p.order_count}건 · ${won(p.revenue)}만원</div>
      </div>`).join('');
  }

  function asChart(summary){
    const W=520,H=220,padL=36,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const target = 5;
    const maxV = Math.max(...summary.map(s=>s.as_rate), target)*1.3;
    const step = innerW/(summary.length-1);
    const yOf = v => padT + innerH - (v/maxV*innerH);

    const pts = summary.map((s,i)=>`${padL+step*i},${yOf(s.as_rate)}`).join(' ');
    const dots = summary.map((s,i)=>`<circle cx="${padL+step*i}" cy="${yOf(s.as_rate)}" r="3.5" fill="var(--accent)"></circle>`).join('');
    const labels = summary.map((s,i)=>`<text x="${padL+step*i}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">${s.month}</text>`).join('');
    const targetY = yOf(target);

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      <line x1="${padL}" y1="${targetY}" x2="${W-padR}" y2="${targetY}" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="${W-padR}" y="${targetY-6}" text-anchor="end" font-size="10" fill="var(--willy-sub)">목표 ${target}%</text>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"></polyline>
      ${dots}${labels}
    </svg>`;
  }

  main();
</script>
</body>
</html>

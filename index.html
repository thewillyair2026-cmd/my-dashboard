<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>경영 대시보드 모음</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --text:#18181b;
    --sub:#71717a;
    --line:#e4e4e7;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:48px 20px 60px;}
  header{margin-bottom:32px;text-align:center;}
  header h1{font-size:26px;margin:0 0 8px;}
  header p{font-size:14px;color:var(--sub);margin:0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  a.card{
    display:block;
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    text-decoration:none;
    color:inherit;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  a.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px);}
  .card .bar{width:32px;height:4px;border-radius:999px;margin-bottom:14px;}
  .card h2{font-size:16px;margin:0 0 6px;}
  .card p{font-size:12px;color:var(--sub);margin:0;line-height:1.5;}
  @media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:460px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>경영 대시보드</h1>
    <p>영역별 숫자를 한눈에 확인하세요</p>
  </header>
  <div class="grid">
    <a class="card" href="marketing/index.html">
      <div class="bar" style="background:#ea580c"></div>
      <h2>마케팅</h2>
      <p>채널별 성과, ROAS, 예산 소진 페이싱</p>
    </a>
    <a class="card" href="hr/index.html">
      <div class="bar" style="background:#7c3aed"></div>
      <h2>인사</h2>
      <p>재직 인원, 인건비 비중, 이직률, 초과근무</p>
    </a>
    <a class="card" href="sales/index.html">
      <div class="bar" style="background:#2563eb"></div>
      <h2>영업</h2>
      <p>월별 매출, 파이프라인 전환율, 담당자·상품 순위</p>
    </a>
    <a class="card" href="pl/index.html">
      <div class="bar" style="background:#16a34a"></div>
      <h2>손익</h2>
      <p>영업이익, 손익분기, 비용 구조, 상품별 마진</p>
    </a>
    <a class="card" href="customer/index.html">
      <div class="bar" style="background:#0d9488"></div>
      <h2>고객</h2>
      <p>코호트 잔존율, 재구매율, 이탈률, LTV</p>
    </a>
    <a class="card" href="exec/index.html">
      <div class="bar" style="background:linear-gradient(90deg,#2563eb,#ea580c,#0d9488,#16a34a,#7c3aed)"></div>
      <h2>경영</h2>
      <p>5개 영역 신호등, 목표 달성률, 이번 달 변화 TOP 3</p>
    </a>
  </div>
</div>
</body>
</html>

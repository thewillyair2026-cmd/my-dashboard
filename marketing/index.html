<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마케팅 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#ea580c; --accent-light:#fed7aa; --accent-bg:#fff7ed; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:28px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:8px 6px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  tbody td{border-bottom:1px solid #f4f4f5;}
  tbody tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  th[data-sort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover{color:var(--willy-text);}
  th[data-sort] .arrow{font-size:0.7em;opacity:0.6;margin-left:3px;}
  th[data-sort].sorted{color:var(--willy-text);}
  th[data-sort].sorted .arrow{opacity:1;color:var(--accent);}
  td.channel{font-weight:600;color:var(--willy-text);text-align:left;}
  .bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .bar-track{width:56px;height:6px;border-radius:4px;background:#f4f4f5;overflow:hidden;flex-shrink:0;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.b2b{background:var(--willy-navy);}
  .bar-fill.b2c{background:var(--accent);}
  .pct-tag{font-weight:700;width:3.6em;text-align:right;}
  .manage-link{display:inline-block;margin-bottom:16px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
  .manage-link:hover{text-decoration:underline;}
  .trend-legend{display:flex;gap:16px;font-size:11px;color:var(--willy-sub);margin-top:8px;}
  .trend-legend span{display:inline-flex;align-items:center;gap:4px;}
  .trend-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;}
  .fee-note{margin-top:12px;padding:10px 14px;background:var(--accent-bg);border-radius:10px;font-size:12px;color:var(--willy-sub);line-height:1.5;}
  .fee-note b{color:var(--accent);}
  .zero-tag{color:#dc2626;font-weight:700;}
  .insight-list{display:flex;flex-direction:column;gap:10px;}
  .insight-item{display:flex;gap:12px;padding:12px 14px;background:var(--accent-bg);border-radius:10px;}
  .insight-item .num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .insight-item .txt strong{display:block;font-size:13px;margin-bottom:2px;}
  .insight-item .txt span{font-size:12px;color:var(--willy-sub);}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'marketing', title:'마케팅 대시보드', subtitle:'답하는 질문 — 어느 채널이 진짜 효율이 좋나? B2B/B2C 채널 성격이 왜 다른가?'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const eok = n => {
    const sign = n<0?'-':'';
    n = Math.abs(Math.round(n));
    const eokPart = Math.floor(n/100000000);
    const manPart = Math.round((n%100000000)/10000);
    return sign + (eokPart>0?`${eokPart}억 `:'') + `${manPart.toLocaleString('ko-KR')}만원`;
  };

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = WillyShell.getAuthClient();
      const [{data:naver,error:e2},{data:channelMonthly,error:e3}] = await Promise.all([
        db.from('marketing_naver_ads').select('*'),
        db.from('marketing_channel_monthly').select('*')
      ]);
      if(e2||e3) throw (e2||e3);
      if(!naver?.length || !channelMonthly?.length) throw new Error('데이터가 비어 있습니다.');
      let period = channelMonthly.map(r=>r.ym).sort().pop();
      const periods = WillyShell.buildPeriodOptions(channelMonthly);
      WillyShell.setPeriodFilter(periods, period, (p)=>{ period = p; render(naver, channelMonthly, period); });
      render(naver, channelMonthly, period);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function periodLabel(period){
    if(period==='ALL') return '전체기간';
    if(period.indexOf('YEAR:')===0) return period.slice(5)+'년 전체';
    return period;
  }

  let currentAggB2c = [], currentAggB2b = [];
  let b2cSort = {key:'contracts', dir:'desc'};
  let b2bSort = {key:'contracts', dir:'desc'};

  document.getElementById('content').addEventListener('click', (e)=>{
    const th = e.target.closest('th[data-sort]');
    if(!th) return;
    const tableId = th.dataset.table;
    const key = th.dataset.sort;
    const sort = tableId==='b2c' ? b2cSort : b2bSort;
    if(sort.key===key) sort.dir = sort.dir==='asc' ? 'desc' : 'asc';
    else { sort.key = key; sort.dir = key==='channel' ? 'asc' : 'desc'; }
    const items = tableId==='b2c' ? currentAggB2c : currentAggB2b;
    document.getElementById(tableId+'-channel-body').innerHTML = channelTable(items, tableId, sort);
  });

  function render(naver, channelMonthly, period){
    const rows = WillyShell.filterByPeriod(channelMonthly, period);
    const b2bRows = rows.filter(r=>r.is_b2b);
    const b2cRows = rows.filter(r=>!r.is_b2b);

    const totalQ = rows.reduce((s,r)=>s+r.quotes,0);
    const totalC = rows.reduce((s,r)=>s+r.contracts,0);
    const totalRev = rows.reduce((s,r)=>s+r.revenue,0);
    const totalRate = totalQ ? totalC/totalQ*100 : 0;

    const b2bQ = b2bRows.reduce((s,r)=>s+r.quotes,0), b2bC = b2bRows.reduce((s,r)=>s+r.contracts,0);
    const b2cQ = b2cRows.reduce((s,r)=>s+r.quotes,0), b2cC = b2cRows.reduce((s,r)=>s+r.contracts,0);
    const b2bRate = b2bQ ? b2bC/b2bQ*100 : 0;
    const b2cRate = b2cQ ? b2cC/b2cQ*100 : 0;

    const agg = aggregateChannel(rows);
    const aggB2c = agg.filter(r=>!r.is_b2b);
    const aggB2b = agg.filter(r=>r.is_b2b);
    currentAggB2c = aggB2c;
    currentAggB2b = aggB2b;
    const topChannel = [...agg].sort((a,b)=>b.quotes-a.quotes)[0];

    const naverSpendTotal = naver.reduce((s,n)=>s+n.spend,0);
    const naverFee = naverSpendTotal * 0.1;
    const naverMonth = naver[0]?.month || '';

    const label = periodLabel(period);
    const content = document.getElementById('content');
    content.innerHTML = `
      <a class="manage-link" href="../input/marketing.html">→ 마케팅 비용 입력 페이지로 이동</a>
      <p style="font-size:11.5px;color:var(--willy-sub);margin:-8px 0 14px;">※ 이 페이지의 계약금액은 신규 유입 채널 기준이라 "설치자"(기존 고객 재구매) 계약은 제외됩니다. 재구매 포함 전체 계약금액은 영업 대시보드를 참고하세요.</p>

      <div class="cards">
        <div class="card">
          <div class="label">${label} 견적→계약 전환율</div>
          <div class="value big">${pct(totalRate)}%</div>
          <div class="sub">견적 ${won(totalQ)}건 · 계약 ${won(totalC)}건</div>
        </div>
        <div class="card">
          <div class="label">${label} 계약금액</div>
          <div class="value">${eok(totalRev)}</div>
          <div class="sub">전체 채널 합계 · 설치자(재구매) 제외</div>
        </div>
        <div class="card">
          <div class="label">B2B vs B2C 전환율</div>
          <div class="value">${pct(b2bRate)}% <span style="font-size:14px;color:var(--willy-sub);">vs</span> ${pct(b2cRate)}%</div>
          <div class="sub">${b2cRate?`인테리어·부동산·베스트샵&갤러리아 제휴가 ${(b2bRate/b2cRate).toFixed(1)}배 높음`:'해당 기간 B2C 데이터 없음'}</div>
        </div>
        <div class="card">
          <div class="label">최다 유입 채널</div>
          <div class="value">${topChannel?topChannel.channel:'-'}</div>
          <div class="sub">${topChannel?`견적 ${won(topChannel.quotes)}건 (전체 ${pct(topChannel.quotes/totalQ*100)}%)`:'데이터 없음'}</div>
        </div>
      </div>

      <div class="panel">
        <h2>월별 계약 추이</h2>
        <p class="panel-note">계약일 기준 · 전체 채널 합계와 상위 채널 2개 비교 · 상단 기간 필터와 무관하게 전체 기간 표시</p>
        ${trendChart(channelMonthly)}
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>B2C 채널 성과</h2>
          <p class="panel-note">${label} · 일반 소비자 유입 채널 · 헤더 클릭으로 정렬</p>
          <div id="b2c-channel-body">${channelTable(aggB2c, 'b2c', b2cSort)}</div>
        </div>
        <div class="panel">
          <h2>B2B 채널 성과</h2>
          <p class="panel-note">${label} · 인테리어·부동산·에어컨설팅·베스트샵&갤러리아 제휴 채널 · 헤더 클릭으로 정렬</p>
          <div id="b2b-channel-body">${channelTable(aggB2b, 'b2b', b2bSort)}</div>
        </div>
      </div>

      <div class="panel">
        <h2>네이버 유료광고 (${naverMonth})</h2>
        <p class="panel-note">파워링크·쇼핑검색은 블로그/스마트스토어로 랜딩되는 구조라 위 채널 표와는 분리 집계됩니다 · 상단 기간 필터와 무관하게 최신월 고정 표시</p>
        <div class="table-scroll">
        <table>
          <thead><tr><th>상품</th><th>노출</th><th>클릭</th><th>광고비</th><th>전환</th><th>전환매출</th></tr></thead>
          <tbody>
            ${naver.map(n=>`
              <tr>
                <td>${n.product}</td>
                <td>${won(n.impressions)}</td>
                <td>${won(n.clicks)}</td>
                <td>${won(n.spend)}원</td>
                <td>${n.conversions===0?`<span class="zero-tag">0건</span>`:won(n.conversions)+'건'}</td>
                <td>${won(n.conversion_revenue)}원</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="fee-note">
          광고비 합계 <b>${won(naverSpendTotal)}원</b> 중 대행사 수수료 10% = <b>${won(naverFee)}원</b>이 별도로 나갑니다.
          파워링크 전환 0건은 광고가 안 통해서가 아니라, 블로그로 랜딩되는 구조상 전환추적 자체가 불가능하기 때문입니다.
          쇼핑검색 전환 21건은 신규 고객이 아니라 <b>기존 계약자가 계약금을 스마트스토어로 결제한 것</b>이라 실제 신규 유입 효과는 거의 없습니다.
        </div>
      </div>

      <div class="panel">
        <h2>이번 주 체크포인트</h2>
        <div class="insight-list">
          <div class="insight-item">
            <div class="num">1</div>
            <div class="txt"><strong>인테리어·부동산·베스트샵&갤러리아 채널 확대 검토</strong><span>${b2cRate?`전환율이 B2C 평균의 ${(b2bRate/b2cRate).toFixed(1)}배 — 물량 대비 효율 최고`:'해당 기간 B2C 비교 데이터 없음'}</span></div>
          </div>
          <div class="insight-item">
            <div class="num">2</div>
            <div class="txt"><strong>네이버 블로그 하락세 확인 필요</strong><span>4월 104건 → 7월 50건대로 감소, 다른 채널은 안 줄었음</span></div>
          </div>
          <div class="insight-item">
            <div class="num">3</div>
            <div class="txt"><strong>쇼핑검색 광고 노출 위치 재검토</strong><span>월 ${won(naver.find(n=>n.product==='쇼핑검색')?.spend||0)}원이 신규 유입 없이 결제 페이지 광고로 소진 중</span></div>
          </div>
        </div>
      </div>
    `;
  }

  function aggregateChannel(rows){
    const agg = {};
    rows.forEach(r=>{
      if(!agg[r.channel]) agg[r.channel] = {channel:r.channel, quotes:0, contracts:0, revenue:0, is_b2b:r.is_b2b};
      agg[r.channel].quotes += r.quotes;
      agg[r.channel].contracts += r.contracts;
      agg[r.channel].revenue += r.revenue;
    });
    return Object.values(agg).map(a=>({...a, rate: a.quotes ? a.contracts/a.quotes*100 : 0}));
  }

  function channelTable(items, type, sort){
    if(!items.length) return '<div style="font-size:12px;color:var(--willy-sub);padding:8px 0;">데이터 없음</div>';
    const rows = items.map(i=>({...i, avg: i.contracts ? i.revenue/i.contracts : null}));
    const dir = sort.dir==='asc' ? 1 : -1;
    rows.sort((a,b)=>{
      if(sort.key==='channel') return dir*String(a.channel).localeCompare(String(b.channel),'ko');
      const av = a[sort.key]==null ? -Infinity : a[sort.key];
      const bv = b[sort.key]==null ? -Infinity : b[sort.key];
      return dir*(av-bv);
    });
    const maxRate = Math.max(...rows.map(r=>r.rate), 0.0001);
    const cols = [['channel','채널',false],['quotes','견적',true],['contracts','계약',true],['rate','전환율',true],['avg','평균계약금액',true]];
    const head = cols.map(([key,label,num])=>{
      const cls = [num?'num':'', sort.key===key?'sorted':''].filter(Boolean).join(' ');
      const arrow = sort.key===key ? `<span class="arrow">${sort.dir==='asc'?'▲':'▼'}</span>` : '';
      return `<th${cls?` class="${cls}"`:''} data-table="${type}" data-sort="${key}">${label}${arrow}</th>`;
    }).join('');
    const body = rows.map(r=>`
      <tr>
        <td class="channel">${r.channel}</td>
        <td class="num">${won(r.quotes)}</td>
        <td class="num">${won(r.contracts)}</td>
        <td class="num"><div class="bar-cell"><div class="bar-track"><div class="bar-fill ${type}" style="width:${r.rate/maxRate*100}%"></div></div><span class="pct-tag">${pct(r.rate)}%</span></div></td>
        <td class="num">${r.avg?won(r.avg)+'원':'-'}</td>
      </tr>`).join('');
    return `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function buildTrendSeries(channelMonthly){
    const months = [...new Set(channelMonthly.map(r=>r.ym))].sort();
    const totalByMonth = {};
    const channelByMonth = {};
    channelMonthly.forEach(r=>{
      totalByMonth[r.ym] = (totalByMonth[r.ym]||0) + r.contracts;
      if(!channelByMonth[r.channel]) channelByMonth[r.channel] = {};
      channelByMonth[r.channel][r.ym] = (channelByMonth[r.channel][r.ym]||0) + r.contracts;
    });
    const channelTotals = Object.entries(channelByMonth)
      .map(([ch,byMonth])=>[ch, Object.values(byMonth).reduce((s,v)=>s+v,0)])
      .sort((a,b)=>b[1]-a[1]);
    const topChannels = channelTotals.slice(0,2).map(c=>c[0]);
    return {months, totalByMonth, channelByMonth, topChannels};
  }

  function trendChart(channelMonthly){
    const {months, totalByMonth, channelByMonth, topChannels} = buildTrendSeries(channelMonthly);
    if(months.length < 2) return '<div style="font-size:12px;color:var(--willy-sub);">데이터가 충분하지 않습니다.</div>';
    const W=1000, H=260, padL=40, padR=16, padT=16, padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const colors = ['var(--willy-navy)', 'var(--accent)', 'var(--willy-sm)'];
    const series = [
      {name:'전체', values: months.map(m=>totalByMonth[m]||0)},
      ...topChannels.map(ch=>({name:ch, values: months.map(m=>(channelByMonth[ch]&&channelByMonth[ch][m])||0)}))
    ].map((s,i)=>({...s, color: colors[i]}));
    const maxV = Math.max(...series.flatMap(s=>s.values), 1) * 1.15;
    const step = months.length>1 ? innerW/(months.length-1) : 0;
    const xOf = i => padL + step*i;
    const yOf = v => padT + innerH - (v/maxV*innerH);

    const gridY = [0,0.25,0.5,0.75,1].map(f=>{
      const y = padT+innerH*(1-f);
      return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E4E4E7" />`;
    }).join('');
    const lines = series.map(s=>{
      const pts = s.values.map((v,i)=>`${xOf(i)},${yOf(v)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join('');
    const labels = months.map((m,i)=>`<text x="${xOf(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--willy-sub)">${m.slice(2)}</text>`).join('');
    const legend = series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      ${gridY}${lines}${labels}
    </svg>
    <div class="trend-legend">${legend}</div>`;
  }

  WillyShell.requireAuth(main);
</script>
</body>
</html>

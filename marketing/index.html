<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마케팅 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#ea580c; --accent-light:#fed7aa; --accent-bg:#fff7ed; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:28px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chan-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f4f4f5;}
  .chan-row:last-child{border-bottom:none;}
  .chan-row .name{width:120px;font-size:12.5px;flex-shrink:0;}
  .chan-bar-bg{flex:1;background:#f4f4f5;border-radius:999px;height:9px;overflow:hidden;}
  .chan-bar-fg{height:100%;border-radius:999px;}
  .chan-bar-fg.b2b{background:var(--willy-navy);}
  .chan-bar-fg.b2c{background:var(--accent);}
  .chan-row .rate{width:44px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0;}
  .chan-row .cnt{width:70px;text-align:right;font-size:11px;color:var(--willy-sub);flex-shrink:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:8px 6px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  tbody td{border-bottom:1px solid #f4f4f5;}
  tbody tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .fee-note{margin-top:12px;padding:10px 14px;background:var(--accent-bg);border-radius:10px;font-size:12px;color:var(--willy-sub);line-height:1.5;}
  .fee-note b{color:var(--accent);}
  .zero-tag{color:#dc2626;font-weight:700;}
  .insight-list{display:flex;flex-direction:column;gap:10px;}
  .insight-item{display:flex;gap:12px;padding:12px 14px;background:var(--accent-bg);border-radius:10px;}
  .insight-item .num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .insight-item .txt strong{display:block;font-size:13px;margin-bottom:2px;}
  .insight-item .txt span{font-size:12px;color:var(--willy-sub);}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  const SUPABASE_URL = 'https://gsqurjwbdkenmjwspucq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcXVyandiZGtlbm1qd3NwdWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTY3MjIsImV4cCI6MjEwMjEzMjcyMn0.VWwpg2uLfFWquknfnKjsj6a_-AfTdQJS8LVw9dSQ0xo';

  WillyShell.mount({active:'marketing', title:'마케팅 대시보드', subtitle:'답하는 질문 — 어느 채널이 진짜 효율이 좋나? B2B/B2C 채널 성격이 왜 다른가?'});

  const { createClient } = supabase;
  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const eok = n => {
    const sign = n<0?'-':'';
    n = Math.abs(Math.round(n));
    const eokPart = Math.floor(n/100000000);
    const manPart = Math.round((n%100000000)/10000);
    return sign + (eokPart>0?`${eokPart}억 `:'') + `${manPart.toLocaleString('ko-KR')}만원`;
  };

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const [{data:naver,error:e2},{data:channelMonthly,error:e3}] = await Promise.all([
        db.from('marketing_naver_ads').select('*'),
        db.from('marketing_channel_monthly').select('*')
      ]);
      if(e2||e3) throw (e2||e3);
      if(!naver?.length || !channelMonthly?.length) throw new Error('데이터가 비어 있습니다.');
      let period = channelMonthly.map(r=>r.ym).sort().pop();
      const periods = WillyShell.buildPeriodOptions(channelMonthly);
      WillyShell.setPeriodFilter(periods, period, (p)=>{ period = p; render(naver, channelMonthly, period); });
      render(naver, channelMonthly, period);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function periodLabel(period){
    if(period==='ALL') return '전체기간';
    if(period.indexOf('YEAR:')===0) return period.slice(5)+'년 전체';
    return period;
  }

  function render(naver, channelMonthly, period){
    const rows = WillyShell.filterByPeriod(channelMonthly, period);
    const b2bRows = rows.filter(r=>r.is_b2b);
    const b2cRows = rows.filter(r=>!r.is_b2b);

    const totalQ = rows.reduce((s,r)=>s+r.quotes,0);
    const totalC = rows.reduce((s,r)=>s+r.contracts,0);
    const totalRev = rows.reduce((s,r)=>s+r.revenue,0);
    const totalRate = totalQ ? totalC/totalQ*100 : 0;

    const b2bQ = b2bRows.reduce((s,r)=>s+r.quotes,0), b2bC = b2bRows.reduce((s,r)=>s+r.contracts,0);
    const b2cQ = b2cRows.reduce((s,r)=>s+r.quotes,0), b2cC = b2cRows.reduce((s,r)=>s+r.contracts,0);
    const b2bRate = b2bQ ? b2bC/b2bQ*100 : 0;
    const b2cRate = b2cQ ? b2cC/b2cQ*100 : 0;

    const agg = aggregateChannel(rows);
    const aggB2c = agg.filter(r=>!r.is_b2b).sort((a,b)=>b.rate-a.rate);
    const aggB2b = agg.filter(r=>r.is_b2b).sort((a,b)=>b.rate-a.rate);
    const topChannel = [...agg].sort((a,b)=>b.quotes-a.quotes)[0];

    const naverSpendTotal = naver.reduce((s,n)=>s+n.spend,0);
    const naverFee = naverSpendTotal * 0.1;
    const naverMonth = naver[0]?.month || '';

    const label = periodLabel(period);
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="cards">
        <div class="card">
          <div class="label">${label} 견적→계약 전환율</div>
          <div class="value big">${pct(totalRate)}%</div>
          <div class="sub">견적 ${won(totalQ)}건 · 계약 ${won(totalC)}건</div>
        </div>
        <div class="card">
          <div class="label">${label} 계약금액</div>
          <div class="value">${eok(totalRev)}</div>
          <div class="sub">전체 채널 합계</div>
        </div>
        <div class="card">
          <div class="label">B2B vs B2C 전환율</div>
          <div class="value">${pct(b2bRate)}% <span style="font-size:14px;color:var(--willy-sub);">vs</span> ${pct(b2cRate)}%</div>
          <div class="sub">${b2cRate?`인테리어·부동산 제휴가 ${(b2bRate/b2cRate).toFixed(1)}배 높음`:'해당 기간 B2C 데이터 없음'}</div>
        </div>
        <div class="card">
          <div class="label">최다 유입 채널</div>
          <div class="value">${topChannel?topChannel.channel:'-'}</div>
          <div class="sub">${topChannel?`견적 ${won(topChannel.quotes)}건 (전체 ${pct(topChannel.quotes/totalQ*100)}%)`:'데이터 없음'}</div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>B2C 채널 전환율</h2>
          <p class="panel-note">${label} · 일반 소비자 유입 채널 · 전환율 높은 순</p>
          ${channelBars(aggB2c, 'b2c')}
        </div>
        <div class="panel">
          <h2>B2B 채널 전환율</h2>
          <p class="panel-note">${label} · 인테리어·부동산·에어컨설팅 제휴 채널 · 물량은 적지만 전환율 높음</p>
          ${channelBars(aggB2b, 'b2b')}
        </div>
      </div>

      <div class="panel">
        <h2>네이버 유료광고 (${naverMonth})</h2>
        <p class="panel-note">파워링크·쇼핑검색은 블로그/스마트스토어로 랜딩되는 구조라 위 채널 표와는 분리 집계됩니다 · 상단 기간 필터와 무관하게 최신월 고정 표시</p>
        <div class="table-scroll">
        <table>
          <thead><tr><th>상품</th><th>노출</th><th>클릭</th><th>광고비</th><th>전환</th><th>전환매출</th></tr></thead>
          <tbody>
            ${naver.map(n=>`
              <tr>
                <td>${n.product}</td>
                <td>${won(n.impressions)}</td>
                <td>${won(n.clicks)}</td>
                <td>${won(n.spend)}원</td>
                <td>${n.conversions===0?`<span class="zero-tag">0건</span>`:won(n.conversions)+'건'}</td>
                <td>${won(n.conversion_revenue)}원</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="fee-note">
          광고비 합계 <b>${won(naverSpendTotal)}원</b> 중 대행사 수수료 10% = <b>${won(naverFee)}원</b>이 별도로 나갑니다.
          파워링크 전환 0건은 광고가 안 통해서가 아니라, 블로그로 랜딩되는 구조상 전환추적 자체가 불가능하기 때문입니다.
          쇼핑검색 전환 21건은 신규 고객이 아니라 <b>기존 계약자가 계약금을 스마트스토어로 결제한 것</b>이라 실제 신규 유입 효과는 거의 없습니다.
        </div>
      </div>

      <div class="panel">
        <h2>이번 주 체크포인트</h2>
        <div class="insight-list">
          <div class="insight-item">
            <div class="num">1</div>
            <div class="txt"><strong>인테리어·부동산 채널 확대 검토</strong><span>${b2cRate?`전환율이 B2C 평균의 ${(b2bRate/b2cRate).toFixed(1)}배 — 물량 대비 효율 최고`:'해당 기간 B2C 비교 데이터 없음'}</span></div>
          </div>
          <div class="insight-item">
            <div class="num">2</div>
            <div class="txt"><strong>네이버 블로그 하락세 확인 필요</strong><span>4월 104건 → 7월 50건대로 감소, 다른 채널은 안 줄었음</span></div>
          </div>
          <div class="insight-item">
            <div class="num">3</div>
            <div class="txt"><strong>쇼핑검색 광고 노출 위치 재검토</strong><span>월 ${won(naver.find(n=>n.product==='쇼핑검색')?.spend||0)}원이 신규 유입 없이 결제 페이지 광고로 소진 중</span></div>
          </div>
        </div>
      </div>
    `;
  }

  function aggregateChannel(rows){
    const agg = {};
    rows.forEach(r=>{
      if(!agg[r.channel]) agg[r.channel] = {channel:r.channel, quotes:0, contracts:0, revenue:0, is_b2b:r.is_b2b};
      agg[r.channel].quotes += r.quotes;
      agg[r.channel].contracts += r.contracts;
      agg[r.channel].revenue += r.revenue;
    });
    return Object.values(agg).map(a=>({...a, rate: a.quotes ? a.contracts/a.quotes*100 : 0}));
  }

  function channelBars(items, type){
    if(!items.length) return '<div style="font-size:12px;color:var(--willy-sub);">데이터 없음</div>';
    const max = Math.max(...items.map(i=>i.rate));
    return items.map(i=>`
      <div class="chan-row">
        <div class="name">${i.channel}</div>
        <div class="chan-bar-bg"><div class="chan-bar-fg ${type}" style="width:${max?i.rate/max*100:0}%"></div></div>
        <div class="rate">${pct(i.rate)}%</div>
        <div class="cnt">${won(i.contracts)}/${won(i.quotes)}건</div>
      </div>`).join('');
  }

  main();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인사 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#7c3aed; --accent-light:#ddd6fe; --accent-bg:#f5f3ff; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:30px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .card .flag{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;}
  .flag.good{background:#dcfce7;color:#16a34a;}
  .flag.bad{background:#fee2e2;color:#dc2626;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .panel-note{font-size:11.5px;color:var(--willy-sub);margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:8px 6px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  tbody td{border-bottom:1px solid #f4f4f5;}
  tbody tr:last-child td{border-bottom:none;}
  .dept-bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .dept-bar-bg{width:70px;height:8px;background:#f4f4f5;border-radius:999px;overflow:hidden;}
  .dept-bar-fg{height:100%;background:var(--accent);border-radius:999px;}
  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .donut-legend{font-size:12px;flex:1;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f4f5;}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .legend-name{color:var(--willy-sub);}
  .leave-bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .leave-bar-bg{width:70px;height:8px;background:#f4f4f5;border-radius:999px;overflow:hidden;}
  .leave-bar-fg{height:100%;background:var(--accent);border-radius:999px;}
  .table-scroll{overflow-x:auto;}
  .manage-link{display:inline-block;margin-bottom:16px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
  .manage-link:hover{text-decoration:underline;}
  .empty-box{padding:24px;text-align:center;color:var(--willy-sub);font-size:13px;background:#fafafa;border-radius:10px;}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
    .donut-wrap{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'hr', title:'인사 대시보드', subtitle:'답하는 질문 — 인건비가 매출의 몇 %인가? (설치기사 도급비 제외)'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const eok = n => {
    const sign = n<0?'-':'';
    n = Math.abs(Math.round(n));
    const eokPart = Math.floor(n/100000000);
    const manPart = Math.round((n%100000000)/10000);
    return sign + (eokPart>0?`${eokPart}억 `:'') + `${manPart.toLocaleString('ko-KR')}만원`;
  };

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = WillyShell.getAuthClient();
      const [{data:employees,error:e1},{data:leaveUsage,error:e2},{data:monthly,error:e3}] = await Promise.all([
        db.from('hr_employees').select('*'),
        db.from('hr_leave_usage').select('*'),
        db.from('sales_monthly').select('*').order('sort_order',{ascending:true})
      ]);
      if(e1||e2||e3) throw (e1||e2||e3);
      if(!monthly?.length) throw new Error('데이터가 비어 있습니다.');
      let period = monthly[monthly.length-1].ym;
      const periods = WillyShell.buildPeriodOptions(monthly);
      WillyShell.setPeriodFilter(periods, period, (p)=>{ period = p; render(employees||[], leaveUsage||[], monthly, period); });
      render(employees||[], leaveUsage||[], monthly, period);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function periodLabel(period){
    if(period==='ALL') return '전체기간';
    if(period.indexOf('YEAR:')===0) return period.slice(5)+'년 전체';
    return period;
  }

  function ymStart(ym){ const [y,m] = ym.split('.').map(Number); return new Date(y, m-1, 1); }
  function ymEnd(ym){ const [y,m] = ym.split('.').map(Number); return new Date(y, m, 0); }
  function toYm(dateStr){ return dateStr.slice(0,7).replace('-','.'); }
  function activeInMonth(e, ym){
    const start = ymStart(ym), end = ymEnd(ym);
    const join = new Date(e.join_date);
    const leave = e.leave_date ? new Date(e.leave_date) : null;
    return join <= end && (!leave || leave >= start);
  }
  function activeNow(e){ return !e.leave_date || new Date(e.leave_date) >= new Date(); }

  function render(employees, leaveUsage, monthly, period){
    if(!employees.length){
      document.getElementById('content').innerHTML = `
        <a class="manage-link" href="../input/hr.html">→ 직원 명부 관리 페이지로 이동</a>
        <div class="empty-box">아직 등록된 직원이 없습니다. 위 링크에서 직원을 추가해주세요.</div>
      `;
      return;
    }

    const yms = WillyShell.filterByPeriod(monthly, period).map(m=>m.ym);
    const label = periodLabel(period);

    const revenueSum = WillyShell.filterByPeriod(monthly, period).reduce((s,m)=>s+m.revenue,0);
    const payrollSum = yms.reduce((s,ym)=> s + employees.filter(e=>activeInMonth(e,ym)).reduce((s2,e)=>s2+e.monthly_salary,0), 0);
    const payrollRate = revenueSum ? payrollSum/revenueSum*100 : 0;

    let joined=0, left=0;
    employees.forEach(e=>{
      if(yms.includes(toYm(e.join_date))) joined++;
      if(e.leave_date && yms.includes(toYm(e.leave_date))) left++;
    });
    const avgHeadcount = yms.length ? yms.reduce((s,ym)=>s+employees.filter(e=>activeInMonth(e,ym)).length,0)/yms.length : 0;
    const turnoverRate = avgHeadcount ? left/avgHeadcount*100 : 0;

    const headcountNow = employees.filter(activeNow).length;
    const headcountAtPeriodEnd = yms.length ? employees.filter(e=>activeInMonth(e, yms[yms.length-1])).length : headcountNow;
    const revenuePerHead = headcountAtPeriodEnd ? revenueSum/headcountAtPeriodEnd : 0;

    const activeList = employees.filter(activeNow);
    const tenure = tenureBuckets(activeList);
    const totalTenure = tenure.reduce((s,t)=>s+t.count,0);
    const dept = deptBreakdown(activeList);

    const leaveYear = period.indexOf('YEAR:')===0 ? period.slice(5) : String(new Date().getFullYear());

    const content = document.getElementById('content');
    content.innerHTML = `
      <a class="manage-link" href="../input/hr.html">→ 직원 명부 관리 / 연차 입력 페이지로 이동</a>

      <div class="cards">
        <div class="card">
          <div class="label">재직 인원 (현재 기준)</div>
          <div class="value big">${headcountNow}명</div>
          <div class="sub">${label} 입사 ${joined}명 · 퇴사 ${left}명</div>
        </div>
        <div class="card">
          <div class="label">${label} 인건비 비중</div>
          <div class="value">${pct(payrollRate)}%</div>
          <span class="flag ${payrollRate<=25?'good':'bad'}">${payrollRate<=25?'기준 25% 이하 정상':'기준 25% 초과'}</span>
          <div class="sub" style="margin-top:6px;">설치기사 도급비는 손익에서 별도 집계</div>
        </div>
        <div class="card">
          <div class="label">${label} 이직률</div>
          <div class="value">${pct(turnoverRate)}%</div>
          <span class="flag ${turnoverRate<=15?'good':'bad'}">${turnoverRate<=15?'양호':'주의'}</span>
        </div>
        <div class="card">
          <div class="label">${label} 1인당 매출</div>
          <div class="value">${eok(revenuePerHead)}</div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>월별 재직 인원</h2>
          <p class="panel-note">각 월말 기준 재직 중이던 인원</p>
          ${headcountChart(employees, monthly, period)}
        </div>
        <div class="panel">
          <h2>근속 분포 (현재 재직자)</h2>
          <div class="donut-wrap">
            ${totalTenure ? tenureDonut(tenure, totalTenure) : '<div class="empty-box" style="flex:1;">재직자가 없습니다.</div>'}
            <div class="donut-legend">
              ${tenure.map((t,i)=>`
                <div class="legend-row">
                  <span><span class="legend-dot" style="background:${donutColor(i)}"></span><span class="legend-name">${t.bucket}</span></span>
                  <span>${t.count}명</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>부서별 인건비 (현재 재직자)</h2>
          <div class="table-scroll">
          <table>
            <thead><tr><th>부서</th><th></th><th>월 인건비</th><th>인원</th></tr></thead>
            <tbody>
              ${(() => {
                const maxPayroll = Math.max(...dept.map(d=>d.payroll), 1);
                return dept.map(d=>`
                  <tr>
                    <td>${d.dept}</td>
                    <td><div class="dept-bar-cell"><div class="dept-bar-bg"><div class="dept-bar-fg" style="width:${d.payroll/maxPayroll*100}%"></div></div></div></td>
                    <td>${won(d.payroll)}원</td>
                    <td>${d.headcount}명</td>
                  </tr>`).join('') || '<tr><td colspan="4">재직자가 없습니다.</td></tr>';
              })()}
            </tbody>
          </table>
          </div>
        </div>
        <div class="panel">
          <h2>연차 사용 현황 (${leaveYear}년)</h2>
          <p class="panel-note">사용일수 / 부여일수</p>
          <div class="table-scroll">
          <table>
            <thead><tr><th>이름</th><th></th><th>사용/부여</th></tr></thead>
            <tbody>
              ${activeList.map(e=>{
                const used = leaveUsage.filter(l=>l.employee_id===e.id && l.ym.startsWith(leaveYear)).reduce((s,l)=>s+Number(l.days_used),0);
                const ratio = e.annual_leave_granted ? Math.min(used/e.annual_leave_granted*100,100) : 0;
                return `<tr>
                  <td>${e.name}</td>
                  <td><div class="leave-bar-cell"><div class="leave-bar-bg"><div class="leave-bar-fg" style="width:${ratio}%"></div></div></div></td>
                  <td>${used}/${e.annual_leave_granted}일</td>
                </tr>`;
              }).join('') || '<tr><td colspan="3">재직자가 없습니다.</td></tr>'}
            </tbody>
          </table>
          </div>
        </div>
      </div>
    `;
  }

  function tenureBuckets(activeList){
    const now = new Date();
    const order = ['3년 이상','1-3년','6개월-1년','6개월 미만'];
    const buckets = {'3년 이상':0,'1-3년':0,'6개월-1년':0,'6개월 미만':0};
    activeList.forEach(e=>{
      const months = (now - new Date(e.join_date)) / (1000*60*60*24*30.44);
      if(months>=36) buckets['3년 이상']++;
      else if(months>=12) buckets['1-3년']++;
      else if(months>=6) buckets['6개월-1년']++;
      else buckets['6개월 미만']++;
    });
    return order.map(bucket=>({bucket, count:buckets[bucket]})).filter(b=>b.count>0);
  }

  function deptBreakdown(activeList){
    const agg = {};
    activeList.forEach(e=>{
      if(!agg[e.dept]) agg[e.dept] = {dept:e.dept, headcount:0, payroll:0};
      agg[e.dept].headcount++;
      agg[e.dept].payroll += e.monthly_salary;
    });
    return Object.values(agg).sort((a,b)=>b.payroll-a.payroll);
  }

  function donutColor(i){
    const colors = ['#7c3aed','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe'];
    return colors[i % colors.length];
  }

  function tenureDonut(tenure, total){
    const size = 160, r = 60, cx = size/2, cy = size/2, sw = 24;
    const circumference = 2*Math.PI*r;
    let offset = 0;
    const segs = tenure.map((t,i)=>{
      const frac = t.count/total;
      const dash = frac*circumference;
      const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${donutColor(i)}" stroke-width="${sw}"
        stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += dash;
      return seg;
    }).join('');
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${segs}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--willy-text)">${total}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">총 인원</text>
      </svg>
    `;
  }

  function headcountChart(employees, monthly, period){
    const W=520,H=220,padL=32,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const series = monthly.map(m=>({ym:m.ym, headcount: employees.filter(e=>activeInMonth(e,m.ym)).length}));
    const maxV = Math.max(...series.map(s=>s.headcount), 1)*1.2;
    const step = innerW/series.length;
    const bw = step*0.5;
    const isSelected = ym => period===ym || (period.indexOf('YEAR:')===0 && ym.startsWith(period.slice(5))) || period==='ALL';
    const bars = series.map((s,i)=>{
      const x = padL+step*i+(step-bw)/2;
      const h = s.headcount/maxV*innerH;
      const y = padT+innerH-h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${isSelected(s.ym)?'var(--accent)':'var(--accent-light)'}"></rect>
              <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">${s.headcount}</text>`;
    }).join('');
    const labels = series.map((s,i)=>{
      const x = padL+step*i+step/2;
      return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--willy-sub)">${s.ym.slice(2)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      ${bars}${labels}
    </svg>`;
  }

  WillyShell.requireAuth(main);
</script>
</body>
</html>

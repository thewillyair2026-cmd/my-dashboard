<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인사 대시보드 · WILLY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../shared/theme.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/shell.js"></script>
<style>
  :root{ --accent:#7c3aed; --accent-light:#ddd6fe; --accent-bg:#f5f3ff; }
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--willy-sub);margin-bottom:8px;}
  .card .value{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .card .value.big{font-size:30px;color:var(--accent);}
  .card .sub{font-size:12px;color:var(--willy-sub);margin-top:6px;}
  .card .flag{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;}
  .flag.good{background:#dcfce7;color:#16a34a;}
  .flag.bad{background:#fee2e2;color:#dc2626;}
  .panel{background:#fff;border:1px solid #E4E4E7;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:8px 6px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--willy-sub);font-weight:500;border-bottom:1px solid #E4E4E7;font-size:12px;}
  tbody td{border-bottom:1px solid #f4f4f5;}
  tbody tr:last-child td{border-bottom:none;}
  .dept-bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .dept-bar-bg{width:70px;height:8px;background:#f4f4f5;border-radius:999px;overflow:hidden;}
  .dept-bar-fg{height:100%;background:var(--accent);border-radius:999px;}
  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .donut-legend{font-size:12px;flex:1;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f4f5;}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .legend-name{color:var(--willy-sub);}
  .ot-table{width:100%;border-collapse:collapse;font-size:12px;}
  .ot-table th{font-weight:500;color:var(--willy-sub);padding:6px 4px;text-align:center;}
  .ot-table th:first-child{text-align:left;}
  .ot-table td{text-align:center;padding:6px 4px;}
  .ot-table td:first-child{text-align:left;color:var(--willy-sub);}
  .ot-cell{border-radius:6px;padding:6px 0;font-weight:600;}
  .table-scroll{overflow-x:auto;}
  .loading,.err{padding:40px;text-align:center;color:var(--willy-sub);font-size:13px;}
  .err{color:#dc2626;}
  @media (max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
    .donut-wrap{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="shell-root"></div>
<div id="content"><div class="loading">불러오는 중...</div></div>

<script>
  WillyShell.mount({active:'hr', title:'인사 대시보드', subtitle:'답하는 질문 — 인건비가 매출의 몇 %인가? (설치기사 도급비 제외, 재직 9명 기준)'});

  const won = n => Math.round(n).toLocaleString('ko-KR');
  const pct = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const OT_ORDER = ['0h','1-10','11-20','21-30','30h+'];

  async function main(){
    const content = document.getElementById('content');
    try{
      const db = WillyShell.getAuthClient();
      const [{data:monthly,error:e1},{data:dept,error:e2},{data:tenure,error:e3},{data:overtime,error:e4}] = await Promise.all([
        db.from('hr_monthly').select('*').order('sort_order',{ascending:true}),
        db.from('hr_dept').select('*'),
        db.from('hr_tenure').select('*').order('sort_order',{ascending:true}),
        db.from('hr_overtime').select('*')
      ]);
      if(e1||e2||e3||e4) throw (e1||e2||e3||e4);
      if(!monthly?.length||!dept?.length||!tenure?.length||!overtime?.length) throw new Error('데이터가 비어 있습니다.');
      let selectedMonth = monthly[monthly.length-1].month;
      WillyShell.setMonthFilter(monthly.map(m=>m.month), selectedMonth, (m)=>{ selectedMonth = m; render(monthly, dept, tenure, overtime, selectedMonth); });
      render(monthly, dept, tenure, overtime, selectedMonth);
    }catch(err){
      content.innerHTML = `<div class="err">데이터를 불러오지 못했습니다.<br>${(err && err.message) || err}</div>`;
      console.error(err);
    }
  }

  function render(monthly, dept, tenure, overtime, selectedMonth){
    const idx = monthly.findIndex(m=>m.month===selectedMonth);
    const thisM = monthly[idx>=0?idx:monthly.length-1];
    const prevM = idx>0 ? monthly[idx-1] : null;

    const payrollRate = thisM.revenue ? thisM.payroll/thisM.revenue*100 : 0;
    const revenuePerHead = thisM.headcount ? thisM.revenue/thisM.headcount : 0;
    const prevRevenuePerHead = prevM && prevM.headcount ? prevM.revenue/prevM.headcount : null;

    const totalLeft = monthly.reduce((s,m)=>s+m.left_count,0);
    const avgHeadcount = monthly.reduce((s,m)=>s+m.headcount,0)/monthly.length;
    const turnoverRate = avgHeadcount ? totalLeft/avgHeadcount*100 : 0;

    const totalTenure = tenure.reduce((s,t)=>s+t.count,0);

    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="cards">
        <div class="card">
          <div class="label">재직 인원</div>
          <div class="value big">${won(thisM.headcount)}명</div>
          <div class="sub">이번 달 입사 ${thisM.joined}명 · 퇴사 ${thisM.left_count}명</div>
        </div>
        <div class="card">
          <div class="label">인건비 비중</div>
          <div class="value">${pct(payrollRate)}%</div>
          <span class="flag ${payrollRate<=25?'good':'bad'}">${payrollRate<=25?'기준 25% 이하 정상':'기준 25% 초과'}</span>
          <div class="sub" style="margin-top:6px;">설치기사 도급비는 손익에서 별도 집계</div>
        </div>
        <div class="card">
          <div class="label">이직률 (누적 기준)</div>
          <div class="value">${pct(turnoverRate)}%</div>
          <span class="flag ${turnoverRate<=15?'good':'bad'}">${turnoverRate<=15?'양호':'주의'}</span>
        </div>
        <div class="card">
          <div class="label">1인당 매출</div>
          <div class="value">${won(revenuePerHead)}만원</div>
          <div class="sub">${prevRevenuePerHead!==null ? diffText(revenuePerHead-prevRevenuePerHead)+' 만원 (전월 대비)' : '전월 데이터 없음'}</div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>월별 재직 인원</h2>
          ${headcountChart(monthly, thisM.month)}
        </div>
        <div class="panel">
          <h2>근속 분포</h2>
          <div class="donut-wrap">
            ${tenureDonut(tenure, totalTenure, turnoverRate)}
            <div class="donut-legend">
              ${tenure.map((t,i)=>`
                <div class="legend-row">
                  <span><span class="legend-dot" style="background:${donutColor(i)}"></span><span class="legend-name">${t.bucket}</span></span>
                  <span>${t.count}명</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>부서별 인건비</h2>
          <div class="table-scroll">
          <table>
            <thead><tr><th>부서</th><th></th><th>금액(만원)</th><th>인원</th></tr></thead>
            <tbody>
              ${(() => {
                const maxPayroll = Math.max(...dept.map(d=>d.payroll));
                return dept.map(d=>`
                  <tr>
                    <td>${d.dept}</td>
                    <td>
                      <div class="dept-bar-cell">
                        <div class="dept-bar-bg"><div class="dept-bar-fg" style="width:${d.payroll/maxPayroll*100}%"></div></div>
                      </div>
                    </td>
                    <td>${won(d.payroll)}</td>
                    <td>${d.headcount}명</td>
                  </tr>`).join('');
              })()}
            </tbody>
          </table>
          </div>
        </div>
        <div class="panel">
          <h2>부서별 월 초과근무 (인원수)</h2>
          <div class="table-scroll">
          ${overtimeTable(overtime)}
          </div>
        </div>
      </div>
    `;
  }

  function diffText(v){
    const s = pct(Math.abs(v));
    return v>=0 ? `+${s}` : `-${s}`;
  }

  function donutColor(i){
    const colors = ['#7c3aed','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe'];
    return colors[i % colors.length];
  }

  function tenureDonut(tenure, total, turnoverRate){
    const size = 160, r = 60, cx = size/2, cy = size/2, sw = 24;
    const circumference = 2*Math.PI*r;
    let offset = 0;
    const segs = tenure.map((t,i)=>{
      const frac = t.count/total;
      const dash = frac*circumference;
      const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${donutColor(i)}" stroke-width="${sw}"
        stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += dash;
      return seg;
    }).join('');
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${segs}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--willy-text)">${total}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">총 인원</text>
      </svg>
      <div style="text-align:center;font-size:11px;color:var(--willy-sub);margin-top:-6px;">이직률 ${pct(turnoverRate)}%</div>
    `;
  }

  function headcountChart(monthly, selectedMonth){
    const W=520,H=220,padL=32,padR=16,padT=16,padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const maxV = Math.max(...monthly.map(m=>m.headcount))*1.2;
    const step = innerW/monthly.length;
    const bw = step*0.5;
    const bars = monthly.map((m,i)=>{
      const x = padL+step*i+(step-bw)/2;
      const h = m.headcount/maxV*innerH;
      const y = padT+innerH-h;
      const isSelected = m.month===selectedMonth;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${isSelected?'var(--accent)':'var(--accent-light)'}"></rect>
              <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">${m.headcount}</text>`;
    }).join('');
    const labels = monthly.map((m,i)=>{
      const x = padL+step*i+step/2;
      return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--willy-sub)">${m.month}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#E4E4E7" />
      ${bars}${labels}
    </svg>`;
  }

  function overtimeTable(overtime){
    const depts = [...new Set(overtime.map(o=>o.dept))];
    const maxCount = Math.max(...overtime.map(o=>o.count));
    const cell = (dept, bucket) => {
      const rec = overtime.find(o=>o.dept===dept && o.bucket===bucket);
      const c = rec ? rec.count : 0;
      const alpha = maxCount ? 0.12 + (c/maxCount)*0.75 : 0.12;
      return `<td><div class="ot-cell" style="background:rgba(124,58,237,${alpha});color:${alpha>0.5?'#fff':'#3f3f46'}">${c}</div></td>`;
    };
    return `<table class="ot-table">
      <thead><tr><th>부서</th>${OT_ORDER.map(b=>`<th>${b}</th>`).join('')}</tr></thead>
      <tbody>
        ${depts.map(d=>`<tr><td>${d}</td>${OT_ORDER.map(b=>cell(d,b)).join('')}</tr>`).join('')}
      </tbody>
    </table>`;
  }

  WillyShell.requireAuth(main);
</script>
</body>
</html>
